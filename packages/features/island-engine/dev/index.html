<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>IslandEngine 測試頁</title>
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        overflow: hidden;
        font-family: system-ui, sans-serif;
      }
      #app {
        width: 100%;
        height: 100%;
      }
      #panel {
        position: fixed;
        top: 12px;
        left: 12px;
        display: flex;
        gap: 6px;
        flex-wrap: wrap;
        align-items: center;
        background: rgba(255, 255, 255, 0.85);
        padding: 8px 10px;
        border-radius: 8px;
      }
      #panel button {
        cursor: pointer;
      }
      #stats {
        font-size: 12px;
        color: #295e5c;
      }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <div id="panel">
      <span>人格：</span>
      <button data-persona="D">D 探探</button>
      <button data-persona="A">A 動動</button>
      <button data-persona="O">O 構構</button>
      <button data-persona="L">L 跨跨</button>
      <button data-persona="C">C 連連</button>
      <button data-persona="">中性</button>
      <label for="seed">Seed</label>
      <input id="seed" value="demo-user-1" size="12" />
      <span id="stats"></span>
    </div>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
