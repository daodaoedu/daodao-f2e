# Nginx 配置檔 - 開發環境
# 支援：
# - https://localhost:443 -> http://localhost:3001 (反向代理到 product)
# - http://localhost:3000 -> http://localhost:3000/zh-TW (重定向到 zh-TW)

# HTTPS 服務器 - 監聽 443 端口，反向代理到 3001
server {
    listen 443 ssl;
    http2 on;
    server_name localhost;

    # SSL 證書配置（開發環境使用自簽名證書）
    ssl_certificate /etc/nginx/ssl/cert.pem;
    ssl_certificate_key /etc/nginx/ssl/key.pem;

    # SSL 配置
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;

    # 反向代理到 product (3001)
    location / {
        proxy_pass http://dev:3001;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }
}

# HTTP 服務器 - 監聽 3000 端口，重定向到 /zh-TW
server {
    listen 3000;
    server_name localhost;

    # 將根路徑重定向到 /zh-TW
    location = / {
        return 301 $scheme://$host:$server_port/zh-TW;
    }

    # 其他路徑直接代理到 website (3000)
    location / {
        proxy_pass http://dev:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }
}
