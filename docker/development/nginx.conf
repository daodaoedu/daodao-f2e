# Nginx 配置檔 - 開發環境
# 支援：
# - app-feat.daodao.so -> http://dev:3001 (反向代理到 product)
# - feat.daodao.so -> http://dev:3000 (反向代理到 website)

# 通用的 proxy headers 配置
map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
}

# HTTPS 服務器 - app-feat.daodao.so，反向代理到 3001
server {
    listen 443 ssl;
    http2 on;
    server_name app-feat.daodao.so;

    ssl_certificate /etc/nginx/ssl/cert.pem;
    ssl_certificate_key /etc/nginx/ssl/key.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;

    location / {
        proxy_pass http://dev:3001;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

# HTTPS 服務器 - feat.daodao.so，反向代理到 3000
server {
    listen 443 ssl;
    http2 on;
    server_name feat.daodao.so;

    ssl_certificate /etc/nginx/ssl/cert.pem;
    ssl_certificate_key /etc/nginx/ssl/key.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;

    # 根路徑內部代理到 /zh-TW（瀏覽器網址保持為 /）
    location = / {
        proxy_pass http://dev:3000/zh-TW;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # /zh-TW 和 /zh-TW/... 路徑直接代理
    location ~ ^/zh-TW(/.*)?$ {
        proxy_pass http://dev:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # /en 和 /en/... 路徑直接代理
    location ~ ^/en(/.*)?$ {
        proxy_pass http://dev:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Next.js 靜態資源直接代理（不進行 rewrite）
    location ~ ^/(_next|assets|favicon\.ico|robots\.txt|sitemap\.xml) {
        proxy_pass http://dev:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 其他路徑內部代理到 /zh-TW/...（瀏覽器網址保持不變）
    location / {
        rewrite ^/(.*)$ /zh-TW/$1 break;
        proxy_pass http://dev:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

# HTTP 服務器 - app-feat.daodao.so，反向代理到 3001
server {
    listen 80;
    server_name app-feat.daodao.so;

    location / {
        proxy_pass http://dev:3001;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

