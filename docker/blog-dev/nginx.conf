# DEV-only static publication server; production configuration is unchanged.
# 此配置會將 /xxxx 自動 rewrite 到 /zh-TW/xxxx

server {
    listen 3000;
    server_name _;
    root /srv/blog-releases/current/site;
    index index.html;

    # Gzip 壓縮
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/xml text/javascript application/x-javascript application/xml+rss application/javascript application/json;

    # Development artifacts are test output and must never be indexed.
    add_header X-Robots-Tag "noindex, nofollow" always;
    add_header Cache-Control "no-store" always;

    # 安全標頭
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;

    # Public identity documents must never fall back to an HTML page.
    location = /blog-release.json {
        try_files $uri =404;
    }
    location = /blog-published-baseline.json {
        try_files $uri =404;
    }

    # The serving root is public site data; operator state is never an endpoint.
    location ~ ^/(active|generation|pending|release|trusted-artifacts)\.json$ {
        return 404;
    }
    location = /.release.lock {
        return 404;
    }
    location ~ ^/(input|inputs|approval|approvals|source|logs|releases|current)(/|$) {
        return 404;
    }

    # 靜態資源快取
    location ~* \.(jpg|jpeg|png|gif|ico|css|js|svg|woff|woff2|ttf|eot)$ {
        expires off;
        add_header Cache-Control "no-store" always;
        # Location-level add_header replaces inherited server headers.
        add_header X-Robots-Tag "noindex, nofollow" always;
        access_log off;
    }

    # Next.js 靜態資源
    location /_next/static/ {
        expires off;
        add_header Cache-Control "no-store" always;
        # Location-level add_header replaces inherited server headers.
        add_header X-Robots-Tag "noindex, nofollow" always;
        access_log off;
    }

    # 處理 assets 目錄
    location /assets/ {
        expires off;
        add_header Cache-Control "no-store" always;
        # Location-level add_header replaces inherited server headers.
        add_header X-Robots-Tag "noindex, nofollow" always;
        access_log off;
    }

    # Blog routes are exported documents: missing articles must remain real 404s.
    # Prefer .html over directories containing nested article exports.
    location = /blog {
        try_files /zh-TW/blog.html /zh-TW/blog/index.html =404;
    }
    location = /blog.html {
        try_files /zh-TW/blog.html =404;
    }
    location = /blog.txt {
        try_files /zh-TW/blog.txt =404;
    }
    location ^~ /blog/ {
        location ~ \.(html|txt)$ {
            try_files /zh-TW$uri =404;
        }
        try_files /zh-TW$uri.html /zh-TW$uri/index.html =404;
    }
    location = /en/blog {
        try_files /en/blog.html /en/blog/index.html =404;
    }
    location ^~ /en/blog/ {
        location ~ \.(html|txt)$ {
            try_files $uri =404;
        }
        try_files $uri.html $uri/index.html =404;
    }
    location = /zh-TW/blog {
        try_files /zh-TW/blog.html /zh-TW/blog/index.html =404;
    }
    location ^~ /zh-TW/blog/ {
        location ~ \.(html|txt)$ {
            try_files $uri =404;
        }
        try_files $uri.html $uri/index.html =404;
    }
    location ^~ /blog-images/ {
        try_files $uri =404;
        expires off;
        add_header Cache-Control "no-store" always;
        # Location-level add_header replaces inherited server headers.
        add_header X-Robots-Tag "noindex, nofollow" always;
    }

    # 處理根路徑，重定向到 zh-TW
    location = / {
        try_files /zh-TW.html /zh-TW/index.html =404;
    }

    # 處理 zh-TW locale 路徑（優先處理，避免被下面的規則攔截）
    location /zh-TW {
        try_files $uri $uri.html $uri/index.html /zh-TW.html =404;
    }

    # 處理 en locale 路徑
    location /en {
        try_files $uri $uri.html $uri/index.html /en.html =404;
    }

    # 處理沒有 locale 前綴的路徑，rewrite 到 zh-TW
    # 例如：/about -> /zh-TW/about
    # 排除：zh-TW、en、_next、assets、favicon.ico 和所有帶副檔名的檔案
    location ~ ^/(?!zh-TW|en|_next|assets|favicon\.ico)([^./]+)(/.*)?$ {
        # 先嘗試完整路徑，再嘗試簡化路徑
        try_files /zh-TW$uri /zh-TW$uri.html /zh-TW$uri/index.html /zh-TW/$1 /zh-TW/$1.html /zh-TW/$1/index.html /zh-TW.html =404;
    }

    # 處理其他路徑（fallback）
    location / {
        try_files $uri $uri.html $uri/index.html =404;
    }

    # 404 錯誤頁面
    error_page 404 /404.html;
    location = /404.html {
        internal;
    }
}
