# Nginx 配置檔 - 用於靜態導出的 Next.js 應用
# 此配置會將 /xxxx 自動 rewrite 到 /zh-TW/xxxx
# /resource 路徑會代理到 legacy 服務

upstream legacy {
    server legacy:3002;
}

# 根據 Referer 判斷請求是否來自 legacy 應用
map $http_referer $is_legacy_request {
    default 0;
    ~*/resource 1;
    ~*/zh-TW/resource 1;
    ~*/en/resource 1;
}

server {
    listen 3000;
    server_name _;
    root /app/apps/website/out;
    index index.html;

    # Gzip 壓縮
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/xml text/javascript application/x-javascript application/xml+rss application/javascript application/json;

    # 安全標頭
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;

    # 處理 /zh-TW/resource 路徑及其所有子路徑（包括靜態資源），直接代理到 legacy
    # 優先匹配，因為路徑更長
    location ~ ^/zh-TW/resource {
        proxy_pass http://legacy;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }

    # 處理 /en/resource 路徑及其所有子路徑（包括靜態資源），直接代理到 legacy
    # 優先匹配，因為路徑更長
    location ~ ^/en/resource {
        proxy_pass http://legacy;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }

    # 處理 /resource 路徑及其所有子路徑，自動轉為 /zh-TW/resource 並代理到 legacy
    location ~ ^/resource {
        rewrite ^/resource(.*)$ /zh-TW/resource$1 break;
        proxy_pass http://legacy;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }

    # 處理 Next.js 靜態資源
    # 先嘗試從 website 提供，如果 404 則 fallback 到 legacy
    location /_next/static/ {
        # 先嘗試從 website 的靜態文件提供
        try_files $uri @legacy_static_fallback;
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # Fallback：如果 website 沒有該文件，代理到 legacy
    location @legacy_static_fallback {
        internal;
        proxy_pass http://legacy$request_uri;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        add_header Cache-Control "public, immutable";
    }

    # 處理 assets 目錄
    # 先嘗試從 website 提供，如果 404 則 fallback 到 legacy
    location /assets/ {
        # 先嘗試從 website 的靜態文件提供
        try_files $uri @legacy_assets_fallback;
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # Fallback：如果 website 沒有該文件，代理到 legacy
    location @legacy_assets_fallback {
        internal;
        proxy_pass http://legacy$request_uri;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        add_header Cache-Control "public, immutable";
    }

    # 處理根路徑，重定向到 zh-TW
    location = / {
        try_files /zh-TW.html /zh-TW/index.html =404;
    }

    # 處理 zh-TW locale 路徑（優先處理，避免被下面的規則攔截）
    # 排除 resource 路徑，因為已經在上面處理
    location ~ ^/zh-TW(?!.*resource)(/.*)?$ {
        try_files $uri $uri.html $uri/index.html /zh-TW.html =404;
    }

    # 處理 en locale 路徑
    # 排除 resource 路徑，因為已經在上面處理
    location ~ ^/en(?!.*resource)(/.*)?$ {
        try_files $uri $uri.html $uri/index.html /en.html =404;
    }

    # 處理沒有 locale 前綴的路徑，rewrite 到 zh-TW
    # 例如：/about -> /zh-TW/about
    # 排除：zh-TW、en、_next、assets、favicon.ico、resource 和所有帶副檔名的檔案
    location ~ ^/(?!zh-TW|en|_next|assets|favicon\.ico|resource)([^./]+)(/.*)?$ {
        # 先嘗試完整路徑，再嘗試簡化路徑
        try_files /zh-TW$uri /zh-TW$uri.html /zh-TW$uri/index.html /zh-TW/$1 /zh-TW/$1.html /zh-TW/$1/index.html /zh-TW.html =404;
    }

    # 處理其他路徑（fallback）
    location / {
        try_files $uri $uri.html $uri/index.html /404.html =404;
    }

    # 404 錯誤頁面
    error_page 404 /404.html;
    location = /404.html {
        internal;
    }
}
