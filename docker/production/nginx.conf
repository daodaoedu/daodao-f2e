# Nginx 配置檔 - 用於靜態導出的 Next.js 應用
# 此配置會將 /xxxx 自動 rewrite 到 /zh-TW/xxxx

server {
    listen 3000;
    server_name _;
    root /app/apps/website/out;
    index index.html;

    # Gzip 壓縮
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/xml text/javascript application/x-javascript application/xml+rss application/javascript application/json;

    # 安全標頭
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;

    # 靜態資源快取
    location ~* \.(jpg|jpeg|png|gif|ico|css|js|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # Next.js 靜態資源
    location /_next/static/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # 處理 assets 目錄
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # 處理根路徑，重定向到 zh-TW
    location = / {
        try_files /zh-TW.html /zh-TW/index.html =404;
    }

    # 處理 zh-TW locale 路徑（優先處理，避免被下面的規則攔截）
    location /zh-TW {
        try_files $uri $uri.html $uri/index.html /zh-TW.html =404;
    }

    # 處理 en locale 路徑
    location /en {
        try_files $uri $uri.html $uri/index.html /en.html =404;
    }

    # 處理沒有 locale 前綴的路徑，rewrite 到 zh-TW
    # 例如：/about -> /zh-TW/about
    # 排除：zh-TW、en、_next、assets、favicon.ico 和所有帶副檔名的檔案
    location ~ ^/(?!zh-TW|en|_next|assets|favicon\.ico)([^./]+)(/.*)?$ {
        # 先嘗試完整路徑，再嘗試簡化路徑
        try_files /zh-TW$uri /zh-TW$uri.html /zh-TW$uri/index.html /zh-TW/$1 /zh-TW/$1.html /zh-TW/$1/index.html /zh-TW.html =404;
    }

    # 處理其他路徑（fallback）
    location / {
        try_files $uri $uri.html $uri/index.html /404.html =404;
    }

    # 404 錯誤頁面
    error_page 404 /404.html;
    location = /404.html {
        internal;
    }
}
