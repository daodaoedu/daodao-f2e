services:
  website:
    build:
      context: ../..
      dockerfile: docker/production/Dockerfile
      target: website
      args:
        APP_NAME: website
        APP_PORT: 3000
    container_name: daodao-website
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
    restart: unless-stopped
    # 如果需要環境變數文件，取消下面的註解
    # env_file:
    #   - ../../.env.production

  product:
    build:
      context: ../..
      dockerfile: docker/production/Dockerfile
      target: product
      args:
        APP_NAME: product
        APP_PORT: 3001
    container_name: daodao-product
    ports:
      - "3001:3001"
    environment:
      - NODE_ENV=production
      - PORT=3001
    restart: unless-stopped
    # 如果需要環境變數文件，取消下面的註解
    # env_file:
    #   - ../../.env.production
