sonar.projectKey=daodaoedu_daodao-f2e
sonar.organization=daodaoedu

# Exclude test files from copy-paste detection
# Test suites inherently repeat similar assertion patterns; CPD on test files
# produces false positives that mask real duplication in source code.
sonar.cpd.exclusions=**/*.test.ts,**/*.test.tsx,**/*.spec.ts,**/*.spec.tsx,**/*.test.js,**/*.spec.js,apps/mobile/constants/**/*.ts
