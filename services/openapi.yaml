openapi: 3.0.0
info:
  title: DaoDao 資源管理 API
  version: 1.0.0
  description: 提供資源管理、心得評價和標籤功能的 RESTful API
  contact:
    name: DaoDao 開發團隊
    email: support@daodao.com
  license:
    name: MIT
    url: https://opensource.org/licenses/MIT
servers:
  - url: http://localhost:4000
    description: 本機開發
  - url: https://server.daoedu.tw/
    description: 開發環境
  - url: https://dao-server.daoedu.tw/
    description: 生產環境
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: 使用 JWT Token 進行身份驗證
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: JWT 認證令牌，格式：Bearer {token}
    SessionAuth:
      type: apiKey
      in: cookie
      name: connect.sid
      description: Session 認證，基於 cookie
  parameters:
    idParam:
      in: path
      name: id
      required: true
      schema:
        type: string
        format: uuid
      description: 資源的唯一識別碼 (UUID)
      example: 123e4567-e89b-12d3-a456-426614174000
    reviewIdParam:
      in: path
      name: id
      required: true
      schema:
        type: string
        pattern: ^[1-9]\d*$
      description: 評論的唯一識別碼（字串格式的數字）
      example: "1"
    resourceIdParam:
      in: path
      name: resourceId
      required: true
      schema:
        type: string
        format: uuid
      description: 資源的唯一識別碼 (UUID)
      example: 123e4567-e89b-12d3-a456-426614174000
    cursorParam:
      in: query
      name: cursor
      required: false
      schema:
        type: string
      description: 游標，用於游標分頁
    limitParam:
      in: query
      name: limit
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
      description: 每頁返回的記錄數
    resourceLimitParam:
      in: query
      name: limit
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 20
        default: 5
      description: 每頁返回的資源數
    reviewLimitParam:
      in: query
      name: limit
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 10
        default: 2
      description: 每頁返回的評論數
    sortParam:
      in: query
      name: sort
      required: false
      schema:
        type: string
        enum:
          - id
          - name
          - created_at
          - updated_at
      description: 排序欄位
    orderParam:
      in: query
      name: order
      required: false
      schema:
        type: string
        enum:
          - asc
          - desc
        default: desc
      description: 排序方向
  responses:
    BadRequest:
      description: 請求參數錯誤
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    Unauthorized:
      description: 未授權，需要登入
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    Forbidden:
      description: 禁止訪問，權限不足
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    NotFound:
      description: 資源不存在
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    InternalServerError:
      description: 伺服器內部錯誤
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
            allOf:
              - $ref: "#/components/schemas/ErrorResponse"
              - type: object
                properties:
                  message:
                    example: 伺服器內部錯誤
    UnauthorizedError:
      description: 未授權錯誤
      content:
        application/json:
          schema:
            allOf:
              - $ref: "#/components/schemas/ErrorResponse"
              - type: object
                properties:
                  message:
                    example: 未經授權的訪問
    ForbiddenError:
      description: 禁止存取錯誤
      content:
        application/json:
          schema:
            allOf:
              - $ref: "#/components/schemas/ErrorResponse"
              - type: object
                properties:
                  message:
                    example: 無權限執行此操作
    ConflictError:
      description: 資源衝突錯誤
      content:
        application/json:
          schema:
            allOf:
              - $ref: "#/components/schemas/ErrorResponse"
              - type: object
                properties:
                  message:
                    example: 此電子郵件已被註冊
    BadRequestError:
      description: 請求參數錯誤
      content:
        application/json:
          schema:
            allOf:
              - $ref: "#/components/schemas/ErrorResponse"
              - type: object
                properties:
                  message:
                    example: 請求參數錯誤
    NotFoundError:
      description: 資源不存在
      content:
        application/json:
          schema:
            allOf:
              - $ref: "#/components/schemas/ErrorResponse"
              - type: object
                properties:
                  message:
                    example: 資源不存在
  schemas:
    LoginRequest:
      type: object
      required:
        - email
        - password
      properties:
        email:
          type: string
          format: email
          description: 用戶電子郵件
          example: user@example.com
        password:
          type: string
          format: password
          description: 用戶密碼
          example: securePassword123
        rememberMe:
          type: boolean
          description: 記住我選項
          default: false
          example: false
    RegisterRequest:
      type: object
      required:
        - username
        - email
        - password
        - confirmPassword
      properties:
        username:
          type: string
          minLength: 3
          maxLength: 50
          description: 用戶名
          example: john_doe
        email:
          type: string
          format: email
          description: 電子郵件
          example: john@example.com
        password:
          type: string
          format: password
          minLength: 8
          description: 密碼
          example: securePassword123
        confirmPassword:
          type: string
          format: password
          description: 確認密碼
          example: securePassword123
        name:
          type: string
          description: 顯示名稱
          example: John Doe
    ForgotPasswordRequest:
      type: object
      required:
        - email
      properties:
        email:
          type: string
          format: email
          description: 用戶電子郵件
          example: user@example.com
    ResetPasswordRequest:
      type: object
      required:
        - token
        - newPassword
        - confirmPassword
      properties:
        token:
          type: string
          description: 密碼重設令牌
          example: reset-token-uuid
        newPassword:
          type: string
          format: password
          minLength: 8
          description: 新密碼
          example: newSecurePassword123
        confirmPassword:
          type: string
          format: password
          description: 確認新密碼
          example: newSecurePassword123
    VerifyEmailRequest:
      type: object
      required:
        - token
        - email
      properties:
        token:
          type: string
          description: 郵件驗證令牌
          example: verify-token-uuid
        email:
          type: string
          format: email
          description: 用戶電子郵件
          example: user@example.com
    AuthResponse:
      type: object
      required:
        - success
        - message
      properties:
        success:
          type: boolean
          description: 操作是否成功
          example: true
        message:
          type: string
          description: 響應訊息
          example: 登入成功
        token:
          type: string
          description: JWT 認證令牌
          example: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...
        user:
          $ref: "#/components/schemas/UserProfile"
        isTemporary:
          type: boolean
          description: 是否為臨時用戶
          example: false
        redirectUrl:
          type: string
          description: 重定向 URL
          example: https://app.example.com/dashboard
    UserProfile:
      type: object
      required:
        - id
      properties:
        id:
          type: integer
          description: 用戶 ID
          example: 1
        username:
          type: string
          description: 用戶名
          example: john_doe
        email:
          type: string
          format: email
          description: 電子郵件
          example: john@example.com
        name:
          type: string
          description: 顯示名稱
          example: John Doe
        photo_url:
          type: string
          nullable: true
          description: 頭像 URL
          example: https://example.com/avatar.jpg
        is_active:
          type: boolean
          description: 帳號是否啟用
          example: true
        email_verified:
          type: boolean
          description: 電子郵件是否已驗證
          example: true
        created_at:
          type: string
          format: date-time
          description: 建立時間
          example: "2024-01-15T10:30:00Z"
        updated_at:
          type: string
          format: date-time
          description: 更新時間
          example: "2024-01-15T10:30:00Z"
        last_login_at:
          type: string
          format: date-time
          nullable: true
          description: 最後登入時間
          example: "2024-01-15T09:15:00Z"
    TempUserProfile:
      type: object
      required:
        - id
        - email
        - name
      properties:
        id:
          type: integer
          description: 臨時用戶 ID
          example: 1
        email:
          type: string
          format: email
          description: 電子郵件
          example: temp@example.com
        name:
          type: string
          description: 顯示名稱
          example: Temp User
        photo_url:
          type: string
          nullable: true
          description: 頭像 URL
          example: https://example.com/avatar.jpg
        google_id:
          type: string
          description: Google OAuth ID
          example: google-oauth-id
        is_verified:
          type: boolean
          description: 是否已驗證
          example: false
        expires_at:
          type: string
          format: date-time
          nullable: true
          description: 過期時間
          example: "2024-01-22T10:30:00Z"
        created_at:
          type: string
          format: date-time
          description: 建立時間
          example: "2024-01-15T10:30:00Z"
    CommentCreateRequest:
      type: object
      required:
        - targetType
        - targetId
        - content
      properties:
        targetType:
          type: string
          enum:
            - post
            - resource
            - note
            - outcome
            - review
            - circle
            - idea
            - portfolio
          description: 評論目標類型
          example: post
        targetId:
          type: string
          description: 目標實體 ID
          example: "123"
        content:
          type: string
          minLength: 1
          maxLength: 5000
          description: 評論內容
          example: 這是一個很有用的資源，謝謝分享！
        visibility:
          type: string
          enum:
            - public
            - private
          default: private
          description: 評論可見性
          example: public
        parentId:
          type: integer
          minimum: 1
          nullable: true
          description: 父評論 ID（用於回覆）
          example: 456
    CommentUpdateRequest:
      type: object
      properties:
        content:
          type: string
          minLength: 1
          maxLength: 5000
          description: 更新的評論內容
          example: 更新後的評論內容
        visibility:
          type: string
          enum:
            - public
            - private
          description: 更新的可見性設定
          example: private
    CommentUser:
      type: object
      required:
        - id
        - name
        - _id
        - roleList
      properties:
        id:
          type: integer
          description: 使用者 ID
          example: 1
        name:
          type: string
          description: 使用者名稱
          example: 張三
        _id:
          type: string
          description: 使用者 UUID
          example: 507f1f77bcf86cd799439011
        roleList:
          type: array
          description: 使用者角色列表
          items:
            type: string
          example:
            - user
            - participant
        photoURL:
          type: string
          nullable: true
          description: 使用者頭像 URL
          example: https://example.com/avatar.jpg
    CommentResponse:
      type: object
      required:
        - id
        - userId
        - content
        - visibility
        - createdAt
        - updatedAt
        - parent_id
        - user
        - replies
      properties:
        id:
          type: integer
          description: 評論 ID
          example: 789
        userId:
          type: integer
          description: 評論作者 ID
          example: 1
        content:
          type: string
          description: 評論內容
          example: 這是一個很有用的資源，謝謝分享！
        visibility:
          type: string
          enum:
            - public
            - private
          description: 評論可見性
          example: public
        createdAt:
          type: string
          format: date-time
          description: 建立時間
          example: "2024-01-15T10:30:00Z"
        updatedAt:
          type: string
          format: date-time
          description: 更新時間
          example: "2024-01-15T10:30:00Z"
        parent_id:
          type: integer
          nullable: true
          description: 父評論 ID
          example: null
        user:
          $ref: "#/components/schemas/CommentUser"
        replies:
          type: array
          description: 子評論列表
          items:
            $ref: "#/components/schemas/CommentResponse"
          example: []
    CommentListResponse:
      allOf:
        - $ref: "#/components/schemas/SuccessResponse"
        - type: object
          properties:
            data:
              type: array
              description: 評論列表
              items:
                $ref: "#/components/schemas/CommentResponse"
    CommentDetailResponse:
      allOf:
        - $ref: "#/components/schemas/SuccessResponse"
        - type: object
          properties:
            data:
              $ref: "#/components/schemas/CommentResponse"
    CommentCreateResponse:
      allOf:
        - $ref: "#/components/schemas/SuccessResponse"
        - type: object
          properties:
            message:
              example: 評論建立成功
            data:
              $ref: "#/components/schemas/CommentResponse"
    CommentUpdateResponse:
      allOf:
        - $ref: "#/components/schemas/SuccessResponse"
        - type: object
          properties:
            message:
              example: 評論更新成功
            data:
              $ref: "#/components/schemas/CommentResponse"
    CommentDeleteResponse:
      allOf:
        - $ref: "#/components/schemas/SuccessResponse"
        - type: object
          properties:
            message:
              example: 評論刪除成功
    ErrorResponse:
      type: object
      required:
        - success
        - message
      properties:
        success:
          type: boolean
          description: 請求是否成功
          example: false
        message:
          type: string
          description: 錯誤訊息
          example: 請求參數錯誤
        error:
          type: string
          description: 詳細錯誤資訊
          example: Invalid request parameters
        errors:
          type: array
          description: 驗證錯誤詳情
          items:
            type: object
            properties:
              path:
                type: string
                example: email
              message:
                type: string
                example: Invalid email format
    PaginationMeta:
      type: object
      required:
        - limit
        - hasNext
        - hasPrev
      properties:
        limit:
          type: integer
          description: 每頁記錄數
          example: 20
        hasNext:
          type: boolean
          description: 是否有下一頁
          example: true
        hasPrev:
          type: boolean
          description: 是否有上一頁
          example: false
        nextCursor:
          type: string
          nullable: true
          description: 下一頁游標
          example: eyJpZCI6MTAwfQ==
        prevCursor:
          type: string
          nullable: true
          description: 上一頁游標
          example: null
        totalEstimate:
          type: integer
          description: 預估總記錄數
          example: 150
        parentTotalEstimate:
          type: integer
          nullable: true
          description: 父分類下的資源總數估計（僅在有子分類篩選時提供）
          example: 45
    SuccessResponse:
      type: object
      required:
        - success
      properties:
        success:
          type: boolean
          description: 請求是否成功
          example: true
        message:
          type: string
          description: 成功訊息
          example: 操作成功
    Timestamps:
      type: object
      properties:
        createdAt:
          type: string
          format: date-time
          description: 建立時間
          example: "2024-01-15T10:30:00Z"
        updatedAt:
          type: string
          format: date-time
          description: 更新時間
          example: "2024-01-15T10:30:00Z"
    UserBasicInfo:
      type: object
      description: 使用者基本資訊
      required:
        - id
        - name
      properties:
        id:
          type: string
          description: 使用者 ID
          example: 660e8400-e29b-41d4-a716-446655440001
          format: uuid
        name:
          type: string
          description: 使用者名稱
          example: 陳小明
        _id:
          type: string
          description: 使用者 UUID
          example: 507f1f77bcf86cd799439011
        roleList:
          type: array
          description: 角色列表
          items:
            type: string
          example:
            - user
        photoURL:
          type: string
          nullable: true
          description: 頭像 URL
          example: https://example.com/avatar.jpg
        educationStage:
          type: string
          nullable: true
          description: 教育階段
          example: bachelor
        tagList:
          type: array
          description: 使用者標籤列表
          items:
            type: string
          example:
            - developer
            - student
        selfIntroduction:
          type: string
          nullable: true
          description: 自我介紹
          example: 我是一名熱愛學習的軟體開發者
        photoUrl:
          type: string
          format: uri
          description: 頭像 URL
          example: https://example.com/avatar.jpg
        role:
          type: string
          description: 角色
          example: 學生
    DatabaseColumn:
      type: object
      properties:
        column_name:
          type: string
          description: 欄位名稱
        data_type:
          type: string
          description: 資料類型
      required:
        - column_name
        - data_type
    PostgresTableInfo:
      type: object
      properties:
        columns:
          type: array
          items:
            $ref: "#/components/schemas/DatabaseColumn"
          description: 表格欄位資訊
      required:
        - columns
    MongoCollectionInfo:
      type: object
      properties:
        fields:
          type: array
          items:
            type: string
          description: 集合欄位列表
      required:
        - fields
    DatabaseInfoResponse:
      type: object
      properties:
        mongo:
          oneOf:
            - type: object
              additionalProperties:
                $ref: "#/components/schemas/MongoCollectionInfo"
            - type: object
              properties:
                error:
                  type: string
          description: MongoDB 資料庫資訊或錯誤訊息
        postgres:
          oneOf:
            - type: object
              additionalProperties:
                $ref: "#/components/schemas/PostgresTableInfo"
            - type: object
              properties:
                error:
                  type: string
          description: PostgreSQL 資料庫資訊或錯誤訊息
      required:
        - mongo
        - postgres
    ContactEmailRequest:
      type: object
      required:
        - from
        - to
        - subject
        - text
        - name
      properties:
        from:
          type: string
          format: email
          description: 寄件人電子郵件地址
          example: sender@example.com
        to:
          type: string
          format: email
          description: 收件人電子郵件地址
          example: receiver@example.com
        subject:
          type: string
          minLength: 1
          maxLength: 200
          description: 郵件主旨
          example: 聯絡表單詢問
        text:
          type: string
          minLength: 1
          maxLength: 5000
          description: 郵件內容
          example: 這是一封聯絡郵件的內容
        name:
          type: string
          minLength: 1
          maxLength: 100
          description: 寄件人姓名
          example: 張三
        title:
          type: string
          maxLength: 200
          description: 標題
          example: 產品詢問
        information:
          oneOf:
            - type: string
              maxLength: 500
            - type: array
              items:
                type: string
                maxLength: 100
              maxItems: 10
          description: 聯絡資訊
        activityTitle:
          type: string
          maxLength: 200
          description: 活動標題
    VerificationEmailRequest:
      type: object
      required:
        - email
        - verifyLink
      properties:
        email:
          type: string
          format: email
          description: 收件人電子郵件地址
          example: user@example.com
        verifyLink:
          type: string
          format: uri
          description: 驗證連結
          example: https://example.com/verify?token=abc123
        name:
          type: string
          maxLength: 100
          description: 收件人姓名
          example: 李四
    WelcomeEmailRequest:
      type: object
      required:
        - email
        - name
      properties:
        email:
          type: string
          format: email
          description: 收件人電子郵件地址
          example: newuser@example.com
        name:
          type: string
          minLength: 1
          maxLength: 100
          description: 收件人姓名
          example: 王五
    PasswordResetEmailRequest:
      type: object
      required:
        - email
        - resetLink
      properties:
        email:
          type: string
          format: email
          description: 收件人電子郵件地址
          example: user@example.com
        resetLink:
          type: string
          format: uri
          description: 密碼重設連結
          example: https://example.com/reset-password?token=xyz789
        name:
          type: string
          maxLength: 100
          description: 收件人姓名
          example: 趙六
    MarathonEmailRequest:
      type: object
      required:
        - email
        - name
        - marathonTitle
      properties:
        email:
          type: string
          format: email
          description: 收件人電子郵件地址
          example: participant@example.com
        name:
          type: string
          minLength: 1
          maxLength: 100
          description: 收件人姓名
          example: 孫七
        marathonTitle:
          type: string
          minLength: 1
          maxLength: 200
          description: 馬拉松活動標題
          example: 2024 春季程式馬拉松
        marathonDate:
          type: string
          maxLength: 100
          description: 馬拉松日期
          example: "2024-04-15"
        marathonDescription:
          type: string
          maxLength: 1000
          description: 馬拉松活動描述
          example: 為期兩天的程式設計挑戰賽
    CustomEmailRequest:
      type: object
      required:
        - to
        - subject
      properties:
        to:
          oneOf:
            - type: string
