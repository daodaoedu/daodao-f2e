  /api/v1/projects:
    get:
      tags:
        - Projects
      summary: 獲取專案列表
      description: 獲取專案列表，支援分頁、篩選和排序
      parameters:
        - in: query
          name: page
          schema:
            type: integer
            minimum: 1
            default: 1
          description: 頁碼
        - in: query
          name: limit
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
          description: 每頁數量
        - in: query
          name: status
          schema:
            type: string
            enum:
              - Not Started
              - Ongoing
              - Completed
              - Canceled
          description: 專案狀態篩選
        - in: query
          name: is_public
          schema:
            type: boolean
          description: 是否公開
        - in: query
          name: user_id
          schema:
            type: string
          description: 用戶ID篩選
        - in: query
          name: search
          schema:
            type: string
          description: 搜尋關鍵字（標題、描述）
        - in: query
          name: sort_by
          schema:
            type: string
            enum:
              - created_at
              - updated_at
              - title
              - start_date
              - end_date
            default: created_at
          description: 排序欄位
        - in: query
          name: sort_order
          schema:
            type: string
            enum:
              - asc
              - desc
            default: desc
          description: 排序方向
