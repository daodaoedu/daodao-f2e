          $ref: "#/components/responses/BadRequest"
        "500":
          $ref: "#/components/responses/InternalServerError"
    post:
      tags:
        - Projects
      summary: 創建新專案
      description: 創建一個新的專案
      security:
        - bearerAuth: []
      requestBody:
        required: true
