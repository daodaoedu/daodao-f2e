          name: search
          schema:
            type: string
          description: 搜索關鍵字
      responses:
        "200":
          description: 成功獲取用戶列表
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/FormattedUser"
                  page:
                    type: integer
                  pageSize:
                    type: integer
                  totalCount:
                    type: integer
                  totalPages:
                    type: integer
        "500":
          $ref: "#/components/responses/InternalServerError"
