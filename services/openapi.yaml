          schema:
            type: string
            enum:
              - university
              - high
              - other
          description: 教育階段過濾 (多個用逗號分隔)
        - in: query
          name: roleList
          schema:
            type: string
          description: 角色列表過濾 (多個用逗號分隔)
        - in: query
          name: location
          schema:
            type: string
          description: 地區過濾 (多個用逗號分隔)
