name: Discord Notification
description: Send Discord Notification

inputs:
  TYPE:
    description: "Embed Type"
    required: false
  TITLE:
    description: "Title"
    required: false
  DESCRIPTION:
    description: "Description"
    required: false
  AUTHOR_NAME:
    description: "Author Name"
    required: false
  AUTHOR_URL:
    description: "Author URL"
    required: false
  AUTHOR_ICON_URL:
    description: "Author Icon URL"
    required: false
  DISCORD_WEBHOOK_URL:
    description: "Discord Webhook URL"
    required: true

runs:
  using: "composite"

  steps:
    - name: Send Discord Notification
      uses: actions/github-script@v7
      env:
        TITLE: ${{ inputs.TITLE }}
        DESCRIPTION: ${{ inputs.DESCRIPTION }}
        TYPE: ${{ inputs.TYPE }}
        AUTHOR_NAME: ${{ inputs.AUTHOR_NAME }}
        AUTHOR_URL: ${{ inputs.AUTHOR_URL }}
        AUTHOR_ICON_URL: ${{ inputs.AUTHOR_ICON_URL }}
        DISCORD_WEBHOOK_URL: ${{ inputs.DISCORD_WEBHOOK_URL }}
      with:
        script: |
          const avatarUrl = "https://raw.githubusercontent.com/daodaoedu/daodao-f2e/main/public/daodao-logo.webp";
          const username = "島島阿學";
          const colors = {
            success: 5763207,
            failure: 15548997,
            info: 1752301,
            default: 9868950,
          };

          const author = {
            name: process.env.AUTHOR_NAME,
            url: process.env.AUTHOR_URL,
            icon_url: process.env.AUTHOR_ICON_URL,
          };

          const embed = {
            author,
            title: process.env.TITLE,
            description: process.env.DESCRIPTION,
            color: colors[process.env.TYPE],
          };

          const payload = {
            avatar_url: avatarUrl,
            username,
            embeds: [embed],
          };

          const discordNotificationRequest = {
            headers: { "Content-Type": "application/json" },
            method: "POST",
            body: JSON.stringify(payload),
          };

          const webhookUrl = process.env.DISCORD_WEBHOOK_URL;

          if (!webhookUrl || webhookUrl.trim() === '') {
            console.error('Discord webhook URL is missing or empty');
            return;
          }

          try {
            new URL(webhookUrl);
          } catch (urlError) {
            console.error('Invalid Discord webhook URL:', urlError.message);
            return;
          }

          try {
            const response = await fetch(
              webhookUrl,
              discordNotificationRequest
            );

            if (!response.ok) {
              console.error(`Failed to send Discord notification: ${response.statusText}`);
              return;
            }
          } catch (error) {
            console.error(error);
            throw error;
          }
