name: Discord Notification
description: Send Discord Notification

inputs:
  TYPE:
    description: "Embed Type"
    required: false
  TITLE:
    description: "Title"
    required: false
  DESCRIPTION:
    description: "Description"
    required: false
  AUTHOR_NAME:
    description: "Author Name"
    required: false
  AUTHOR_URL:
    description: "Author URL"
    required: false
  AUTHOR_ICON_URL:
    description: "Author Icon URL"
    required: false
  DISCORD_WEBHOOK_URL:
    description: "Discord Webhook URL"
    required: true

runs:
  using: "composite"

  steps:
    - name: Send Discord Notification
      uses: actions/github-script@v7
      env:
        TITLE: ${{ inputs.TITLE }}
        DESCRIPTION: ${{ inputs.DESCRIPTION }}
        TYPE: ${{ inputs.TYPE }}
        AUTHOR_NAME: ${{ inputs.AUTHOR_NAME }}
        AUTHOR_URL: ${{ inputs.AUTHOR_URL }}
        AUTHOR_ICON_URL: ${{ inputs.AUTHOR_ICON_URL }}
        DISCORD_WEBHOOK_URL: ${{ inputs.DISCORD_WEBHOOK_URL }}
      with:
        script: |
          const avatarUrl = "https://raw.githubusercontent.com/daodaoedu/daodao-f2e/main/public/assets/brand/daodao-logo.webp";
          const username = "島島阿學";
          const colors = {
            success: 5763207,
            failure: 15548997,
            info: 1752301,
            default: 9868950,
          };

          // 只有當有有效的 author 資訊時才建立 author 物件
          let author = undefined;
          if (process.env.AUTHOR_NAME && process.env.AUTHOR_NAME.trim() !== '') {
            author = {
              name: process.env.AUTHOR_NAME,
              url: process.env.AUTHOR_URL || undefined,
              icon_url: process.env.AUTHOR_ICON_URL || undefined,
            };
          }

          // 處理 description，限制長度並清理格式
          let description = process.env.DESCRIPTION || '';
          
          // 如果內容太長，截斷並添加省略號
          if (description.length > 4000) {
            description = description.substring(0, 3900) + '\n\n... (內容已截斷)';
          }
          
          // 如果包含大量錯誤信息，使用代碼塊格式
          if (description.includes('error TS') || description.includes('Type \'')) {
            description = '```\n' + description + '\n```';
          }

          const embed = {
            title: process.env.TITLE,
            description: description,
            color: colors[process.env.TYPE] || colors.default,
          };
          
          // 只有當 author 存在時才添加到 embed
          if (author) {
            embed.author = author;
          }

          const payload = {
            avatar_url: avatarUrl,
            username,
            embeds: [embed],
          };

          const discordNotificationRequest = {
            headers: { "Content-Type": "application/json" },
            method: "POST",
            body: JSON.stringify(payload),
          };

          const webhookUrl = process.env.DISCORD_WEBHOOK_URL;

          if (!webhookUrl || webhookUrl.trim() === '') {
            console.error('Discord webhook URL is missing or empty');
            return;
          }

          try {
            new URL(webhookUrl);
          } catch (urlError) {
            console.error('Invalid Discord webhook URL:', urlError.message);
            return;
          }

          try {
            const response = await fetch(
              webhookUrl,
              discordNotificationRequest
            );

            if (!response.ok) {
              console.error(`Failed to send Discord notification: ${response.statusText}`);
              return;
            }
          } catch (error) {
            console.error(error);
            throw error;
          }
