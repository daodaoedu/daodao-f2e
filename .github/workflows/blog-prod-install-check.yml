name: Blog production installation contract
on:
  pull_request:
    paths:
      - '.github/scripts/blog_prod_*.py'
      - '.github/scripts/blog-cd-ownership.py'
      - '.github/scripts/__tests__/**'
      - '.github/workflows/blog-prod-publish.yml'
      - '.github/workflows/blog-prod-install-check.yml'
      - '.github/workflows/linode-ci.yml'
      - '.github/workflows/linode-cd.yml'
  push:
    branches: [prod]
    paths:
      - '.github/scripts/blog_prod_*.py'
      - '.github/scripts/blog-cd-ownership.py'
      - '.github/scripts/__tests__/**'
      - '.github/workflows/blog-prod-publish.yml'
      - '.github/workflows/blog-prod-install-check.yml'
      - '.github/workflows/linode-ci.yml'
      - '.github/workflows/linode-cd.yml'
permissions: {}
jobs:
  contract:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '20.19.4'
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: '10.20.0'
          run_install: false
      - run: pnpm install --frozen-lockfile --filter "@daodao/blog-content..."
      - run: pnpm --filter @daodao/config generate:env
      - run: 'python3 -m pip install --only-binary=:all: PyYAML==6.0.2'
      - run: python3 -m unittest discover -s .github/scripts/__tests__ -p 'test_blog*.py' -v
