name: Update i18n

on:
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  update_i18n:
    name: Update i18n Translations
    runs-on: ubuntu-latest

    steps:
      - name: Git checkout
        uses: actions/checkout@v4
        with:
          # 見 generate-mobile-tokens.yml：PR 要能觸發 CI 才有 required checks
          token: ${{ secrets.BOT_PAT || secrets.GITHUB_TOKEN }}

      - name: Setup pnpm
        uses: pnpm/action-setup@a7487c7e89a18df4991f7f222e4898a00d66ddda

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'pnpm'

      - name: Fetch i18n Translations
        run: pnpm i18n:fetch
        env:
          GAS_I18N_URL: ${{ secrets.GAS_I18N_URL }}

      - name: Check for i18n changes
        id: check_changes
        run: |
          # status --porcelain 才看得到新增的 locale 檔
          [ -z "$(git status --porcelain -- shared/config/locales)" ] \
            || echo "changes=true" >> "$GITHUB_OUTPUT"

      - name: Deliver i18n changes（受保護分支開 PR，其餘直接 push）
        if: success() && steps.check_changes.outputs.changes == 'true'
        env:
          GH_TOKEN: ${{ secrets.BOT_PAT || secrets.GITHUB_TOKEN }}
        run: |
          bash .github/scripts/commit-changes.sh \
            "i18n: update translations" \
            "i18n" \
            shared/config/locales
