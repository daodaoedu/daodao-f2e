name: Scheduled Blog publication

on:
  push:
    branches: [dev]
    paths:
      - '.github/workflows/blog-scheduled-publish.yml'
      - '.github/scripts/website_managed_sync.py'
  schedule:
    # Once every 24 hours, 09:00 Asia/Taipei (UTC+08:00).
    - cron: '0 1 * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: Report the publication decision without dispatching a release
        type: boolean
        default: true

permissions: {}

jobs:
  schedule:
    if: github.repository == 'daodaoedu/daodao-f2e'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      group: website-managed-sync-prod
      cancel-in-progress: false
    permissions:
      contents: read
      actions: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - name: Check the prepared publication schedule
        id: schedule
        env:
          GH_TOKEN: ${{ github.token }}
          BLOG_PROD_RELEASE_MANAGED: ${{ vars.BLOG_PROD_RELEASE_MANAGED }}
          BLOG_PROD_CONTENT_SHA: ${{ vars.BLOG_PROD_CONTENT_SHA }}
          BLOG_PROD_PUBLISHED_CONTENT_SHA: ${{ vars.BLOG_PROD_PUBLISHED_CONTENT_SHA }}
          BLOG_PROD_PUBLICATION_SCHEDULE: ${{ vars.BLOG_PROD_PUBLICATION_SCHEDULE }}
          DRY_RUN: ${{ (github.event_name == 'push' || inputs.dry_run) && 'true' || 'false' }}
        shell: bash
        run: |
          args=(--channel prod --scheduled-only)
          if [ "$DRY_RUN" = true ]; then args+=(--dry-run); fi
          python3 .github/scripts/website_managed_sync.py "${args[@]}"
      - name: Alert when a scheduled publication needs attention
        if: failure() && steps.schedule.outcome == 'failure'
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          REASON: ${{ steps.schedule.outputs.reason }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        shell: bash
        run: |
          if [ -z "$DISCORD_WEBHOOK_URL" ]; then
            echo '::warning::Scheduled publication failed; see this Actions run.'
            exit 0
          fi
          payload=$(jq -n --arg reason "${REASON:-schedule check failed}" --arg url "$RUN_URL" \
            '{embeds: [{title: "Scheduled Blog publication needs attention", description: ($reason + "\n" + $url), color: 15158332}]}')
          curl -fsS -H 'Content-Type: application/json' -d "$payload" "$DISCORD_WEBHOOK_URL"
