name: Continuous Delivery

concurrency:
  group: cd-${{ github.workflow }}-${{ github.head_ref }}
  cancel-in-progress: true

on:
  push:
    branches:
      - 'prod'
      - 'dev'

  pull_request:
    branches:
      - '**'
      - '!prod'
    types:
      - opened
      - synchronize
      - reopened

  workflow_dispatch:

env:
  BRANCH_NAME: ${{ github.ref_name }}
  PROD_URL: 'https://www.daoedu.tw/'
  HUSKY: 0

jobs:
  continuous_integration:
    uses: ./.github/workflows/continuous-integration.yml
    secrets: inherit

  build_and_deploy:
    name: Build and Deploy to Cloudflare
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 30
    needs: continuous_integration
    if: needs.continuous_integration.result == 'success'

    steps:
      - name: Git checkout
        uses: actions/checkout@v4

      - name: Cache dependencies
        id: cache
        uses: actions/cache@v3
        with:
          path: |
            node_modules
            ~/.cache/Cypress
          key: deps-node-modules-${{ hashFiles('**/yarn.lock') }}

      - name: Install dependencies
        if: steps.cache.outputs.cache-hit != 'true'
        run: yarn install --frozen-lockfile

      - name: Build
        run: yarn pages:build
        env:
          NEXT_PUBLIC_API_URL: ${{ github.ref_name == 'prod' && secrets.NEXT_PUBLIC_API_URL || secrets.NEXT_PUBLIC_API_URL_DEV }}

      - name: Deploy to Cloudflare
        id: deploy
        uses: cloudflare/wrangler-action@v3
        env:
          HAS_SECRETS: ${{ secrets.CLOUDFLARE_API_TOKEN != '' && secrets.CLOUDFLARE_ACCOUNT_ID != '' && secrets.GITHUB_TOKEN != '' }}
        if: ${{ env.HAS_SECRETS == 'true' }}
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}
          command: pages deploy --branch=${{ env.BRANCH_NAME }}

    outputs:
      preview-url: ${{ github.ref_name == 'prod' && env.PROD_URL || steps.deploy.outputs.pages-deployment-alias-url }}
      cmd-output: ${{ steps.deploy.outputs.command-stderr }}

  send_result:
    name: Send Result
    runs-on: ubuntu-latest
    needs: build_and_deploy
    env:
      HAS_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK_URL != '' }}
    if: always()

    steps:
      - name: Git checkout
        uses: actions/checkout@v4

      - name: Send Build and Deploy Failed Notification
        if: ${{ needs.build_and_deploy.result == 'failure' && env.HAS_WEBHOOK == 'true' }}
        uses: ./.github/actions/notification
        with:
          TYPE: failure
          TITLE: '❌ Build and Deploy Failed'
          DESCRIPTION: '${{ needs.build_and_deploy.outputs.cmd-output }}'
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}

      - name: Send Build Succeeded Notification
        if: ${{ needs.build_and_deploy.result == 'success' && env.HAS_WEBHOOK == 'true' }}
        uses: ./.github/actions/notification
        with:
          TYPE: success
          TITLE: '✅ Build Succeeded'
          DESCRIPTION: 'Preview URL: ${{ needs.build_and_deploy.outputs.preview-url }}'
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
