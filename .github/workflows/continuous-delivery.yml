name: Continuous Delivery

concurrency:
  group: cd-${{ github.workflow }}-${{ github.head_ref }}
  cancel-in-progress: true

on:
  push:
    branches:
      - "prod"
      - "dev"

  pull_request:
    branches:
      - "**"
      - "!prod"
    types:
      - opened
      - synchronize
      - reopened

  workflow_dispatch:

env:
  BRANCH_NAME: ${{ github.ref_name }}
  PROD_URL: "https://www.daoedu.tw/"
  HUSKY: 0

jobs:
  continuous_integration:
    uses: ./.github/workflows/continuous-integration.yml
    secrets: inherit

  build_and_deploy:
    name: Build and Deploy to Cloudflare
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 30
    needs: continuous_integration
    if: needs.continuous_integration.result == 'success'

    steps:
      - name: Git checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v2
        with:
          version: 8
          
      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install

      - name: Build
        id: build
        continue-on-error: true
        run: pnpm cf-build
        env:
          NEXT_PUBLIC_API_URL: ${{ github.ref_name == 'prod' && secrets.NEXT_PUBLIC_API_URL || secrets.NEXT_PUBLIC_API_URL_DEV }}

      - name: Deploy to Cloudflare
        if: ${{ env.HAS_SECRETS == 'true' && steps.build.outcome == 'success' }}
        id: deploy
        continue-on-error: true
        uses: cloudflare/wrangler-action@v3
        env:
          HAS_SECRETS: ${{ secrets.CLOUDFLARE_API_TOKEN != '' && secrets.CLOUDFLARE_ACCOUNT_ID != '' && secrets.GITHUB_TOKEN != '' }}
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}
          command: pages deploy --branch=${{ env.BRANCH_NAME }}

      - name: Send Build and Deploy Failed Notification
        if: (steps.build.outcome == 'failure' || steps.deploy.outcome == 'failure')
        uses: ./.github/actions/notification
        with:
          TYPE: failure
          TITLE: "❌ Build and Deploy Failed"
          DESCRIPTION: "${{ steps.deploy.outputs.command-stderr }}"
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}

      - name: Check on failure
        if: steps.build.outcome == 'failure' || steps.deploy.outcome == 'failure'
        env:
          ERROR: ${{ steps.deploy.outputs.command-stderr }}
        run: |
          echo "❌ Build and Deploy Failed"
          echo $ERROR
          exit 1

      - name: Send Build Succeeded Notification
        if: steps.deploy.outcome == 'success'
        uses: ./.github/actions/notification
        with:
          TYPE: success
          TITLE: "✅ Build Succeeded"
          DESCRIPTION: "Preview URL: ${{ github.ref_name == 'prod' && env.PROD_URL || steps.deploy.outputs.pages-deployment-alias-url }}"
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
