name: Generate Mobile Tokens

on:
  push:
    branches:
      - dev
      - 'feat/**'
    paths:
      - 'packages/design-tokens/src/**'

  workflow_dispatch:

env:
  HUSKY: 0

permissions:
  contents: write
  pull-requests: write

jobs:
  generate:
    name: Generate Mobile Design Tokens
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # 受保護分支要改走 PR，GITHUB_TOKEN 開的 PR 不會觸發 pull_request workflow
          # （required checks 永遠不出現），所以有 BOT_PAT 時優先用它。
          token: ${{ secrets.BOT_PAT || secrets.GITHUB_TOKEN }}

      - name: Setup pnpm
        uses: pnpm/action-setup@a7487c7e89a18df4991f7f222e4898a00d66ddda

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install

      - name: Generate mobile tokens
        run: pnpm --filter @daodao/design-tokens generate:mobile

      - name: Check for changes
        id: check
        run: |
          # 用 status --porcelain：git diff 看不到新增的未追蹤生成物
          if [ -z "$(git status --porcelain -- apps/mobile/generated/)" ]; then
            echo "has_changes=false" >> "$GITHUB_OUTPUT"
          else
            echo "has_changes=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Deliver changes（受保護分支開 PR，其餘直接 push）
        if: steps.check.outputs.has_changes == 'true'
        env:
          GH_TOKEN: ${{ secrets.BOT_PAT || secrets.GITHUB_TOKEN }}
        run: |
          bash .github/scripts/commit-changes.sh \
            "chore(mobile): auto-generate design tokens" \
            "mobile-tokens" \
            apps/mobile/generated/
