name: Linode CI

# ===== 並發控制設定 =====
# 目的：防止同一分支的多個 CI 檢查同時執行，避免資源浪費
# group: 針對 PR 使用 head_ref，其他情況使用 ref
# cancel-in-progress: 當新的 CI 檢查觸發時，自動取消舊的檢查
# =======================
concurrency:
  group: linode-ci-${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

# ===== 觸發條件設定 =====
# 1. push：當推送到 main, dev, feat/** 分支時觸發
# 2. pull_request：當向 main 或 dev 分支提交 PR 時觸發
# 3. workflow_dispatch：手動觸發選項
# =======================
on:
  push:
    branches:
      - main
      - dev
      - prod
      - 'feat/**'
  pull_request:
    branches:
      - main
      - dev
      - prod
  workflow_dispatch:

# ===== 全域環境變數 =====
env:
  NODE_VERSION: 20
  PNPM_VERSION: 10

jobs:
  # ===== 主要測試與品質檢查階段 =====
  test:
    runs-on: ubuntu-latest
    outputs:
      artifact-name: build-files-${{ github.sha }}
      build-website: ${{ steps.changes.outputs.website }}
      build-product: ${{ steps.changes.outputs.product }}
    steps:
      # ===== 代碼檢出 =====
      # PR 需要完整歷史做 base/head diff；push 只需前一個 commit
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      # ===== 檢測檔案變更 =====
      - name: Detect file changes
        id: changes
        run: |
          # 如果是 PR，比較 PR 的 base 和 head
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            BASE_SHA="${{ github.event.pull_request.base.sha }}"
            HEAD_SHA="${{ github.event.pull_request.head.sha }}"
          else
            # 如果是 push，比較前一個 commit
            if git rev-parse HEAD~1 >/dev/null 2>&1; then
              BASE_SHA="HEAD~1"
              HEAD_SHA="HEAD"
            else
              # 第一個 commit，檢查所有檔案
              BASE_SHA=""
              HEAD_SHA="HEAD"
            fi
          fi

          echo "Comparing changes between $BASE_SHA and $HEAD_SHA"

          # 獲取變更的檔案列表
          if [ -z "$BASE_SHA" ]; then
            CHANGED_FILES=$(git diff-tree --no-commit-id --name-only -r $HEAD_SHA)
          else
            CHANGED_FILES=$(git diff --name-only $BASE_SHA $HEAD_SHA)
          fi

          echo "Changed files:"
          echo "$CHANGED_FILES"

          # 檢查是否需要 build website
          if echo "$CHANGED_FILES" | grep -qE '^(apps/website/|packages/|turbo.json|package.json|pnpm-lock.yaml|pnpm-workspace.yaml)'; then
            echo "website=true" >> $GITHUB_OUTPUT
            echo "✅ Website needs rebuild"
          else
            echo "website=false" >> $GITHUB_OUTPUT
            echo "⏭️  Website skipped (no changes)"
          fi

          # 檢查是否需要 build product
          if echo "$CHANGED_FILES" | grep -qE '^(apps/product/|packages/|turbo.json|package.json|pnpm-lock.yaml|pnpm-workspace.yaml)'; then
            echo "product=true" >> $GITHUB_OUTPUT
            echo "✅ Product needs rebuild"
          else
            echo "product=false" >> $GITHUB_OUTPUT
            echo "⏭️  Product skipped (no changes)"
          fi

      # ===== Node.js 環境設定 =====
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      # ===== 安裝 pnpm =====
      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          run_install: false

      # ===== 取得 pnpm store 路徑 =====
      - name: Get pnpm store directory
        shell: bash
        run: |
          echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_ENV

      # ===== pnpm 依賴快取 =====
      - name: Setup pnpm cache
        uses: actions/cache@v4
        with:
          path: ${{ env.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      # ===== 依賴安裝 =====
      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # ===== Next.js 構建快取 =====
      - name: Cache Next.js builds
        uses: actions/cache@v4
        with:
          path: |
            apps/website/.next/cache
            apps/product/.next/cache
          key: ${{ runner.os }}-nextjs-${{ hashFiles('**/pnpm-lock.yaml') }}-${{ hashFiles('apps/**/*.ts', 'apps/**/*.tsx', 'apps/**/*.js', 'apps/**/*.jsx', 'packages/**/*.ts', 'packages/**/*.tsx') }}
          restore-keys: |
            ${{ runner.os }}-nextjs-${{ hashFiles('**/pnpm-lock.yaml') }}-

      # ===== 並行品質檢查 =====
      - name: Run checks in parallel
        run: |
          echo "🔍 Running TypeScript type checking..."
          pnpm run typecheck &

          echo "📝 Running linting..."
          pnpm run lint &

          echo "🧪 Running tests..."
          pnpm test &

          wait

      # ===== 設定環境變數 =====
      - name: Create environment files
        run: |
          echo "${{ secrets.ENV_DEV }}" > .env
          cp .env apps/website/.env
          cp .env apps/product/.env

      # ===== 建置前置 packages（codegen） =====
      - name: Build prerequisite packages
        run: |
          echo "⚙️ Generating config env (requires .env)..."
          pnpm --filter @daodao/config generate:env

          echo "⚙️ Building assets (SVG codegen)..."
          pnpm --filter @daodao/assets build

      # ===== 構建驗證 =====
      - name: Build applications
        run: |
          echo "🏗️ Building applications based on changes..."

          BUILD_WEBSITE="${{ steps.changes.outputs.website }}"
          BUILD_PRODUCT="${{ steps.changes.outputs.product }}"

          if [ "$BUILD_WEBSITE" = "true" ] && [ "$BUILD_PRODUCT" = "true" ]; then
            echo "Building both website and product..."
            pnpm run build
          elif [ "$BUILD_WEBSITE" = "true" ]; then
            echo "Building website only..."
            pnpm --filter @daodao/website build
          elif [ "$BUILD_PRODUCT" = "true" ]; then
            echo "Building product only..."
            pnpm --filter @daodao/product build
          else
            echo "⏭️  No applications need to be built"
          fi

      # ===== 上傳構建產物 =====
      - name: Upload build artifacts
        if: steps.changes.outputs.website == 'true' || steps.changes.outputs.product == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: build-files-${{ github.sha }}
          path: |
            ${{ steps.changes.outputs.website == 'true' && 'apps/website/.next' || '' }}
            ${{ steps.changes.outputs.product == 'true' && 'apps/product/.next' || '' }}
            package.json
            pnpm-lock.yaml
            pnpm-workspace.yaml
            turbo.json
          retention-days: 1

  # ===== CI 成功通知 =====
  notify-success:
    runs-on: ubuntu-latest
    needs: test
    if: success()
    steps:
      - name: Send CI Success Notification
        run: |
          AUTHOR="${{ github.actor }}"
          REPO="${{ github.repository }}"
          BRANCH="${{ github.ref_name }}"
          COMMIT_SHA="${{ github.sha }}"
          SHORT_SHA="${COMMIT_SHA:0:7}"
          CURRENT_TIME=$(date -u +"%Y-%m-%dT%H:%M:%SZ")

          curl -X POST -H "Content-Type: application/json" -d "{
            \"embeds\": [{
              \"color\": 3066993,
              \"title\": \"✅ Linode CI Passed\",
              \"thumbnail\": {
                \"url\": \"https://img.shields.io/badge/CI-Passed-brightgreen.png?style=for-the-badge&logo=github-actions&logoColor=white\"
              },
              \"fields\": [
                {\"name\": \"Repository\", \"value\": \"$REPO\", \"inline\": false},
                {\"name\": \"Branch\", \"value\": \"$BRANCH\", \"inline\": true},
                {\"name\": \"Author\", \"value\": \"$AUTHOR\", \"inline\": true},
                {\"name\": \"Commit\", \"value\": \"[\`$SHORT_SHA\`](https://github.com/$REPO/commit/$COMMIT_SHA)\", \"inline\": false}
              ],
              \"timestamp\": \"$CURRENT_TIME\"
            }]
          }" ${{ secrets.DISCORD_WEBHOOK_URL }}

  # ===== CI 失敗通知 =====
  notify-failure:
    runs-on: ubuntu-latest
    needs: test
    if: failure()
    steps:
      - name: Send CI Failure Notification
        run: |
          AUTHOR="${{ github.actor }}"
          REPO="${{ github.repository }}"
          BRANCH="${{ github.ref_name }}"
          COMMIT_SHA="${{ github.sha }}"
          SHORT_SHA="${COMMIT_SHA:0:7}"
          CURRENT_TIME=$(date -u +"%Y-%m-%dT%H:%M:%SZ")

          curl -X POST -H "Content-Type: application/json" -d "{
            \"embeds\": [{
              \"color\": 16711680,
              \"title\": \"❌ Linode CI Failed\",
              \"thumbnail\": {
                \"url\": \"https://img.shields.io/badge/CI-Failed-red.png?style=for-the-badge&logo=github-actions&logoColor=white\"
              },
              \"fields\": [
                {\"name\": \"Repository\", \"value\": \"$REPO\", \"inline\": false},
                {\"name\": \"Branch\", \"value\": \"$BRANCH\", \"inline\": true},
                {\"name\": \"Author\", \"value\": \"$AUTHOR\", \"inline\": true},
                {\"name\": \"Commit\", \"value\": \"[\`$SHORT_SHA\`](https://github.com/$REPO/commit/$COMMIT_SHA)\", \"inline\": false}
              ],
              \"timestamp\": \"$CURRENT_TIME\"
            }]
          }" ${{ secrets.DISCORD_WEBHOOK_URL }}
