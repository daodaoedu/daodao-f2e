name: PR Description

on:
  pull_request:
    types: [opened, synchronize, reopened, edited]

# GitHub Models retired: preserve the author's description and verification
# evidence instead of attempting to overwrite them with unavailable AI output.
# This checks description presence only; the PR Evidence Gate checks evidence.
permissions: {}

jobs:
  validate_description:
    name: Validate PR description
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check author-provided title and description
        shell: python
        run: |
          import json
          import os
          import re
          from pathlib import Path

          event = json.loads(Path(os.environ["GITHUB_EVENT_PATH"]).read_text())
          pr = event["pull_request"]
          title = (pr.get("title") or "").strip()
          body = re.sub(r"<!--[\s\S]*?-->", "", pr.get("body") or "").strip()
          if not title or not body:
              print("::error::Provide a PR title and description explaining the change.")
              raise SystemExit(1)
          Path(os.environ["GITHUB_STEP_SUMMARY"]).write_text(
              "The PR has an author-provided title and description.\n\n"
              "The description was preserved, including its verification evidence. "
              "No AI generation or code review was performed by this job.\n"
          )
