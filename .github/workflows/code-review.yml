name: Code Review

on:
  pull_request:
    types: [opened, synchronize, reopened]

# GitHub Models and its inference API retired on July 30, 2026.
# https://docs.github.com/en/github-models
# Keep an explicit skipped check rather than reporting a review that did not run.
# Human approvals remain enforced by branch protection. CodeQL, SonarCloud,
# GitGuardian, and Linode CI run in their existing independent workflows.
permissions: {}

jobs:
  review:
    name: AI Code Review (retired service - not performed)
    if: ${{ false }}
    runs-on: ubuntu-latest
    steps:
      - run: echo "GitHub Models is retired. This job does not provide a code review."
