name: Code Review

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

concurrency:
  group: code-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review:
    name: AI Code Review
    # Draft and already-reviewed shared-config sync PRs do not spend model calls.
    if: ${{ !github.event.pull_request.draft && !startsWith(github.head_ref, 'chore/sync-claude-config-') }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      pull-requests: write
      contents: read
      checks: write
    steps:
      - name: Checkout data revisions
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Load trusted review runtime
        id: runtime
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          mkdir -p "$RUNNER_TEMP/review-runtime" "$RUNNER_TEMP/review-output"
          git cat-file -e "$BASE_SHA^{commit}"
          git cat-file -e "$HEAD_SHA^{commit}"
          available=true
          if ! git show "$BASE_SHA:.github/scripts/build-review-batches.py" > "$RUNNER_TEMP/review-runtime/build-review-batches.py" 2>/dev/null; then
            available=false
          fi
          if ! git show "$BASE_SHA:.github/scripts/run-review-batches.py" > "$RUNNER_TEMP/review-runtime/run-review-batches.py" 2>/dev/null; then
            available=false
          fi
          echo "available=$available" >> "$GITHUB_OUTPUT"
          if [ "$available" != true ]; then
            # Never execute a PR's replacement reviewer with provider secrets.
            # First adoption must land the runtime in the trusted base first.
            printf '## Code Review\n\n⚠️ **Review 未完成**：可信任 base 尚無完整分批 runtime；此 PR 需獨立人工／本機 review。沒有執行模型審查，不代表程式碼通過。\n' > "$RUNNER_TEMP/review-output/review-body.md"
            printf '%s\n' '{"complete":false,"reason":"trusted_runtime_missing"}' > "$RUNNER_TEMP/review-output/status.json"
          fi
      - name: Build deterministic context from trusted base
        if: steps.runtime.outputs.available == 'true'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          CURRENT_PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          PACK_FILE="$RUNNER_TEMP/context-pack.md"
          TRUSTED_SCRIPT="$RUNNER_TEMP/retrieve-context.sh"
          if ! git show "$BASE_SHA:.github/scripts/retrieve-context.sh" > "$TRUSTED_SCRIPT" 2>/dev/null; then
            : > "$PACK_FILE"
            echo "::warning::Context Pack unavailable: trusted base has no retriever"
          elif ! bash "$TRUSTED_SCRIPT" "$BASE_SHA" "$HEAD_SHA" "$PACK_FILE"; then
            : > "$PACK_FILE"
            echo "::warning::Context Pack unavailable: retrieval failed"
          fi
          if ! git show "$BASE_SHA:REVIEW.md" > "$RUNNER_TEMP/review-policy.md" 2>/dev/null; then
            : > "$RUNNER_TEMP/review-policy.md"
            echo "::warning::Review policy unavailable at base"
          fi
          KNOWLEDGE_SCRIPT="$RUNNER_TEMP/review-knowledge.cjs"
          KNOWLEDGE_DB="$RUNNER_TEMP/false-positives.jsonl"
          : > "$RUNNER_TEMP/known-fp.md"
          if git show "$BASE_SHA:.github/scripts/review-knowledge.cjs" > "$KNOWLEDGE_SCRIPT" 2>/dev/null \
            && git show "$BASE_SHA:.github/review-knowledge/false-positives.jsonl" > "$KNOWLEDGE_DB" 2>/dev/null; then
            node "$KNOWLEDGE_SCRIPT" prompt-block --db "$KNOWLEDGE_DB" > "$RUNNER_TEMP/known-fp.md" \
              || echo '::warning::Historical false-positive context unavailable'
          fi
      # #368: on synchronize, files whose PR diff (vs merge-base) is unchanged since the last review
      # reuse that review instead of calling the model again; a rebase / update-branch that leaves the
      # PR's own diff untouched calls no model at all. The baseline is a hidden marker in the bot's
      # own review comment (no expiring cache). Files the last run left unreviewed are not in it.
      # opened / reopened / ready_for_review and the `ai-review:full` label always review everything.
      - name: Load previous review baseline
        if: steps.runtime.outputs.available == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          ACTION: ${{ github.event.action }}
        run: |
          BASELINE="$RUNNER_TEMP/previous-review-comment.md"
          : > "$BASELINE"
          if [ "$ACTION" != synchronize ]; then
            echo "Full review: pull_request.$ACTION"
            exit 0
          fi
          # Read live, so adding the label and re-running this job forces a full review.
          if ! LABELS="$(gh api --paginate "repos/$REPOSITORY/issues/$PR_NUMBER/labels" --jq '.[].name')"; then
            echo "::warning::PR labels unavailable; reviewing every file"
            exit 0
          fi
          if printf '%s\n' "$LABELS" | grep -Fqx 'ai-review:full'; then
            echo "Full review: label ai-review:full"
            exit 0
          fi
          if ! COMMENTS="$(gh api --paginate --slurp "repos/$REPOSITORY/issues/$PR_NUMBER/comments")"; then
            echo "::warning::Previous review unavailable; reviewing every file"
            exit 0
          fi
          # Only the bot's own comments; the newest review that recorded a baseline wins.
          printf '%s' "$COMMENTS" | jq -r '[add // [] | .[]
            | select(.user.login == "github-actions[bot]" and (.body | contains("<!-- daodao-ai-code-review-state:")))]
            | sort_by(.updated_at) | last | .body // empty' > "$BASELINE" || : > "$BASELINE"
      - name: Plan complete-file batches
        if: steps.runtime.outputs.available == 'true'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          BASELINE="$RUNNER_TEMP/previous-review-comment.md"
          PREVIOUS=()
          # A trusted base from before #368 has no incremental planner: it reviews every file.
          if [ -s "$BASELINE" ] && grep -Fq -- "'--previous-comment'" "$RUNNER_TEMP/review-runtime/build-review-batches.py"; then
            PREVIOUS=(--previous-comment "$BASELINE")
          fi
          python3 -I "$RUNNER_TEMP/review-runtime/build-review-batches.py" \
            --repo "$GITHUB_WORKSPACE" --base "$BASE_SHA" --head "$HEAD_SHA" \
            --out "$RUNNER_TEMP/review-plan" \
            --max-batch-bytes 40000 --max-batches 24 --max-total-bytes 800000 \
            "${PREVIOUS[@]}"
      - name: Review bounded batches with Workers AI
        if: steps.runtime.outputs.available == 'true'
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_WORKERS_AI_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_WORKERS_AI_API_TOKEN }}
          REVIEW_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}/attempts/${{ github.run_attempt }}
        run: |
          RUN_URL_ARGS=()
          if grep -Fq -- "'--run-url'" "$RUNNER_TEMP/review-runtime/run-review-batches.py"; then
            RUN_URL_ARGS=(--run-url "$REVIEW_RUN_URL")
          fi
          python3 -I "$RUNNER_TEMP/review-runtime/run-review-batches.py" \
            --manifest "$RUNNER_TEMP/review-plan/manifest.json" \
            --out "$RUNNER_TEMP/review-output" \
            --policy "$RUNNER_TEMP/review-policy.md" \
            --context "$RUNNER_TEMP/context-pack.md" \
            --known-fp "$RUNNER_TEMP/known-fp.md" \
            "${RUN_URL_ARGS[@]}"
      - name: Preserve review inputs and coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ai-review-${{ github.event.pull_request.number }}-${{ github.event.pull_request.head.sha }}
          path: |
            ${{ runner.temp }}/review-plan/
            ${{ runner.temp }}/review-output/
          if-no-files-found: warn
          retention-days: 7
      - name: Publish review execution summary
        if: always()
        run: |
          if [ -f "$RUNNER_TEMP/review-output/review-body.md" ]; then
            cat "$RUNNER_TEMP/review-output/review-body.md" >> "$GITHUB_STEP_SUMMARY"
          else
            printf '⚠️ Review 未完成：runtime 執行失敗，未產生 coverage report。\n' >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Post coverage-aware review snapshot
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REPOSITORY: ${{ github.repository }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          REVIEW_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          # No source content or model output is interpolated into shell code.
          if ! printf '%s\n' "$HEAD_SHA" | grep -Eq '^[0-9a-f]{40}$'; then
            exit 1
          fi
          python3 -I - <<'PY'
          import os
          import json
          import re
          from pathlib import Path
          root = Path(os.environ['RUNNER_TEMP']) / 'review-output'
          root.mkdir(exist_ok=True)
          body_path = root / 'review-body.md'
          body = body_path.read_text() if body_path.exists() else '## Code Review\n\n⚠️ Review 未完成：runtime 執行失敗。\n'
          # Prefix snapshot ownership ourselves; model cannot spoof comment markers.
          body = body.replace('<!--', '&lt;!--')
          # Baseline for the next synchronize (#368), appended after escaping; GitHub caps a comment at 65,536.
          state_path = root / 'review-state-marker.txt'
          state = state_path.read_text().strip() if state_path.exists() else ''
          if len(state) > 16100 or not re.fullmatch(r'<!-- daodao-ai-code-review-state:[A-Za-z0-9+/=]+ -->', state):
              state = ''
          if len(body) > 45000:
              # Preserve the full report in the artifact; shorten only presentation.
              status_path = root / 'status.json'
              status = json.loads(status_path.read_text()) if status_path.exists() else {}
              complete = status.get('complete') is True
              label = '靜態審查覆蓋完整' if complete else 'Review 未完成／有證據限制'
              body = ('## Code Review\n\n**' + label + '**\n\n'
                      + '完整報告超過留言預算，未刪除 artifact 中的任何輸入或紀錄。\n\n'
                      + '已審查檔案：' + str(len(status.get('reviewed_paths', [])))
                      + '；未審查：' + str(len(status.get('unreviewed', [])))
                      + '；findings：' + str(len(status.get('findings', []))) + '。\n\n'
                      + '[完整 coverage report 與 evidence artifacts]('
                      + os.environ['REVIEW_RUN_URL'] + ')\n\n'
                      + '此結果不代表測試、部署或產品驗收通過。\n')
          head = os.environ['HEAD_SHA']
          marker = '<!-- daodao-ai-code-review -->\n<!-- daodao-ai-code-review-head:' + head + ' -->'
          (root / 'review-comment-body.md').write_text('## Code Review\n\n' + marker + '\n\n' + body.removeprefix('## Code Review').lstrip()
                                                       + ('\n' + state + '\n' if state else ''))
          PY
          BODY_FILE="$RUNNER_TEMP/review-output/review-comment-body.md"
          HEAD_MARKER="<!-- daodao-ai-code-review-head:$HEAD_SHA -->"
          COMMENTS="$(gh api --paginate --slurp "repos/$REPOSITORY/issues/$PR_NUMBER/comments" \
            | jq --arg marker "$HEAD_MARKER" \
              'add | [.[] | select(.user.login == "github-actions[bot]" and (.body | contains($marker)))]')"
          COMMENT_ID=$(printf '%s' "$COMMENTS" | jq -r '.[0].id // empty')
          # Structured JSON preserves literal newlines, quotes and shell characters.
          jq -n --rawfile body "$BODY_FILE" '{body:$body}' > "$RUNNER_TEMP/review-comment.json"
          if [ -n "$COMMENT_ID" ]; then
            gh api "repos/$REPOSITORY/issues/comments/$COMMENT_ID" \
              --method PATCH --input "$RUNNER_TEMP/review-comment.json"
          else
            gh api "repos/$REPOSITORY/issues/$PR_NUMBER/comments" \
              --method POST --input "$RUNNER_TEMP/review-comment.json"
          fi
      # Runs after the comment is posted, so failing here never hides the coverage report.
      # Nothing reviewed (model outage, runtime error) fails the job in every mode: a green check
      # would claim a review that never happened. Files left unreviewed fail only in block mode;
      # in warn mode they surface as a neutral check. AI Code Review is not a required check.
      - name: Flag incomplete review on the check
        id: coverage
        if: always()
        env:
          MODE: ${{ vars.AI_REVIEW_COVERAGE_MODE || 'warn' }}
        run: |
          # Counts only: changed paths are untrusted and must not reach workflow commands.
          python3 -I - <<'PY'
          import json
          import os
          from pathlib import Path
          path = Path(os.environ['RUNNER_TEMP']) / 'review-output' / 'status.json'
          try:
              status = json.loads(path.read_text())
          except (OSError, ValueError):
              status = {}
          if not isinstance(status, dict):
              status = {}
          unreviewed = status.get('unreviewed')
          known = isinstance(unreviewed, list)
          sources = [x for x in unreviewed or [] if not str(x.get('reason', '') if isinstance(x, dict) else '').startswith('generated')]
          partial = [x for x in status.get('limitations') or [] if str(x).startswith('部分脈絡')]
          # Files carried from an earlier review of the same PR diff (#368) are already out of
          # `unreviewed`, so they count as covered. `reviewed` stays this run's model work only: when
          # every batch sent this time fails, the new changes were not reviewed and the job still fails.
          carried = status.get('carried') if isinstance(status.get('carried'), list) else []
          reviewed = status.get('reviewed_paths') or []
          bootstrap = status.get('reason') == 'trusted_runtime_missing'
          attempted = (status.get('planned_batches') or 0) > 0
          if status.get('complete') is True:
              state = 'complete'
          elif not reviewed and ((not known and not bootstrap) or (attempted and sources)):
              # Model calls or the runtime failed; files that never fit a batch are 'partial' instead.
              state = 'none'
          elif sources or partial or bootstrap:
              state = 'partial'
          else:
              state = 'complete'
          with open(os.environ.get('GITHUB_OUTPUT', os.devnull), 'a') as out:
              out.write(f'state={state}\nunreviewed={len(sources)}\npartial={len(partial)}\ncarried={len(carried)}\n')
          if state == 'none':
              print('::error title=AI review 未執行::'
                    f'0 個檔案被審查、{len(sources)} 個非產物檔案未審查（模型呼叫或 runtime 失敗）；稍後 re-run 此 job，詳見 review 留言')
              raise SystemExit(1)
          if state == 'partial':
              print('::warning title=AI review 未完成::'
                    f'{len(sources)} 個非產物檔案未審查、{len(partial)} 個檔案只審部分脈絡；詳見 review 留言與 job summary')
              if os.environ.get('MODE') == 'block' and sources:
                  raise SystemExit(1)
          PY
      - name: Publish review coverage check
        if: always() && (steps.coverage.outputs.state == 'partial' || steps.coverage.outputs.state == 'complete')
        env:
          STATE: ${{ steps.coverage.outputs.state }}
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          UNREVIEWED: ${{ steps.coverage.outputs.unreviewed }}
          PARTIAL: ${{ steps.coverage.outputs.partial }}
          CARRIED: ${{ steps.coverage.outputs.carried }}
          REVIEW_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          # Counts are integers written by the step above; no PR-controlled text reaches the check.
          printf '%s\n' "$UNREVIEWED" "$PARTIAL" "$CARRIED" | grep -Eqx '[0-9]+' || exit 1
          TITLE="全部非產物檔案已審查"
          if [ "$CARRIED" -gt 0 ]; then
            TITLE="$TITLE（$CARRIED 個檔案 diff 未變，沿用上次審查）"
          fi
          # Always posted, so a later complete re-run of the same head replaces an earlier neutral result.
          if [ "$STATE" = complete ]; then
            gh api "repos/$REPOSITORY/check-runs" --method POST \
              -f name='AI review coverage' -f head_sha="$HEAD_SHA" \
              -f status=completed -f conclusion=success \
              -f "output[title]=$TITLE" \
              -f "output[summary]=報告與 artifact：$REVIEW_RUN_URL" \
              > /dev/null
          else
            gh api "repos/$REPOSITORY/check-runs" --method POST \
              -f name='AI review coverage' -f head_sha="$HEAD_SHA" \
              -f status=completed -f conclusion=neutral \
              -f "output[title]=$UNREVIEWED 個非產物檔案未審查、$PARTIAL 個檔案只審部分脈絡" \
              -f "output[summary]=AI review 沒有涵蓋全部檔案，綠燈不代表已審完。未審查檔案與原因見 PR 上的 review 留言；報告與 artifact：$REVIEW_RUN_URL" \
              > /dev/null
          fi
