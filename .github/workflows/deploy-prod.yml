name: Deploy to Production

on:
  push:
    branches:
      - prod
  workflow_dispatch:
    inputs:
      app_name:
        description: 'Which app to deploy'
        required: true
        default: 'all'
        type: choice
        options:
          - all
          - website
          - product

env:
  DOCKER_HUB_USERNAME: ${{ secrets.DOCKER_HUB_USERNAME }}
  DOCKER_HUB_TOKEN: ${{ secrets.DOCKER_HUB_TOKEN }}

jobs:
  deploy-website:
    name: Deploy Website to Production
    runs-on: ubuntu-latest
    if: ${{ github.event.inputs.app_name == 'all' || github.event.inputs.app_name == 'website' || github.event_name == 'push' }}
    environment: production

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: prod

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_TOKEN }}

      - name: Build and push Website Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./docker/production/Dockerfile
          push: true
          build-args: |
            APP_NAME=website
            APP_PORT=3000
          tags: |
            ${{ secrets.DOCKER_HUB_USERNAME }}/daodao-website:prod-latest
            ${{ secrets.DOCKER_HUB_USERNAME }}/daodao-website:prod-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Deploy Website to Linode VPS
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.LINODE_HOST }}
          username: ${{ secrets.LINODE_USER }}
          key: ${{ secrets.LINODE_SSH_KEY }}
          script: |
            cd /path/to/daodao-f2e
            export DOCKER_HUB_USERNAME=${{ secrets.DOCKER_HUB_USERNAME }}
            export COMMIT_SHA=${{ github.sha }}
            ./deploy.sh prod website

      - name: Notify Discord on Success
        if: success()
        uses: sarisia/actions-status-discord@v1
        with:
          webhook: ${{ secrets.DISCORD_WEBHOOK }}
          title: "✅ Production Website Deployment Successful"
          description: |
            **App:** Website
            **Environment:** Production
            **Commit:** ${{ github.sha }}
            **Branch:** prod
            **URL:** https://daodao.so
          color: 0x00ff00

      - name: Notify Discord on Failure
        if: failure()
        uses: sarisia/actions-status-discord@v1
        with:
          webhook: ${{ secrets.DISCORD_WEBHOOK }}
          title: "❌ Production Website Deployment Failed"
          description: |
            **App:** Website
            **Environment:** Production
            **Commit:** ${{ github.sha }}
            **Branch:** prod
          color: 0xff0000

  deploy-product:
    name: Deploy Product to Production
    runs-on: ubuntu-latest
    if: ${{ github.event.inputs.app_name == 'all' || github.event.inputs.app_name == 'product' || github.event_name == 'push' }}
    environment: production

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: prod

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_TOKEN }}

      - name: Build and push Product Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./docker/production/Dockerfile
          push: true
          build-args: |
            APP_NAME=product
            APP_PORT=3001
          tags: |
            ${{ secrets.DOCKER_HUB_USERNAME }}/daodao-product:prod-latest
            ${{ secrets.DOCKER_HUB_USERNAME }}/daodao-product:prod-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Deploy Product to Linode VPS
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.LINODE_HOST }}
          username: ${{ secrets.LINODE_USER }}
          key: ${{ secrets.LINODE_SSH_KEY }}
          script: |
            cd /path/to/daodao-f2e
            export DOCKER_HUB_USERNAME=${{ secrets.DOCKER_HUB_USERNAME }}
            export COMMIT_SHA=${{ github.sha }}
            ./deploy.sh prod product

      - name: Notify Discord on Success
        if: success()
        uses: sarisia/actions-status-discord@v1
        with:
          webhook: ${{ secrets.DISCORD_WEBHOOK }}
          title: "✅ Production Product Deployment Successful"
          description: |
            **App:** Product
            **Environment:** Production
            **Commit:** ${{ github.sha }}
            **Branch:** prod
            **URL:** https://app.daodao.so
          color: 0x00ff00

      - name: Notify Discord on Failure
        if: failure()
        uses: sarisia/actions-status-discord@v1
        with:
          webhook: ${{ secrets.DISCORD_WEBHOOK }}
          title: "❌ Production Product Deployment Failed"
          description: |
            **App:** Product
            **Environment:** Production
            **Commit:** ${{ github.sha }}
            **Branch:** prod
          color: 0xff0000
