name: Blog production publication

on:
  workflow_dispatch:
    inputs:
      ci_run_id:
        description: Successful Linode CI run for the current prod commit
        required: true
        type: string
      legacy_bootstrap:
        description: First cutover only, from the verified original legacy content revision
        required: false
        default: false
        type: boolean
      expected_content_sha:
        description: Scheduled publication guard; must match the prepared content revision
        required: false
        default: ''
        type: string

permissions:
  contents: read
  actions: read

concurrency:
  group: blog-production-publication
  cancel-in-progress: false

jobs:
  publish:
    if: github.repository == 'daodaoedu/daodao-f2e' && github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/prod'
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 60
    env:
      BLOG_PROD_RELEASE_MANAGED: ${{ vars.BLOG_PROD_RELEASE_MANAGED }}
      BLOG_PROD_CONTENT_SHA: ${{ vars.BLOG_PROD_CONTENT_SHA }}
      BLOG_PROD_PUBLISHED_CONTENT_SHA: ${{ vars.BLOG_PROD_PUBLISHED_CONTENT_SHA }}
      BLOG_PROD_APPROVALS: ${{ vars.BLOG_PROD_APPROVALS }}
      BLOG_PROD_EXPECTED_CONTENT_SHA: ${{ inputs.expected_content_sha }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Verify exact production CI and freeze release inputs
        id: gate
        env:
          GH_TOKEN: ${{ github.token }}
          CI_RUN_ID: ${{ inputs.ci_run_id }}
        run: python3 .github/scripts/blog_prod_gate.py prepare --ci-run-id "$CI_RUN_ID"

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '20.19.4'
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          run_install: false

      - name: Checkout exact official content revision
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4
        with:
          repository: daodaoedu/daodao-blog
          ref: ${{ steps.gate.outputs.content-sha }}
          path: .blog-dev-preview-source
          persist-credentials: false

      - name: Checkout trusted previously published content
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4
        with:
          repository: daodaoedu/daodao-blog
          ref: ${{ steps.gate.outputs.baseline-content-sha }}
          path: .blog-prod-published-source
          persist-credentials: false

      - name: Install frontend dependencies
        run: |
          unset BLOG_PROD_APPROVALS
          pnpm install --frozen-lockfile
          pnpm --filter @daodao/config generate:env

      - name: Stage frozen approved content
        env:
          GH_TOKEN: ${{ github.token }}
          SNAPSHOT: ${{ steps.gate.outputs.snapshot }}
          SNAPSHOT_SHA256: ${{ steps.gate.outputs.snapshot-sha256 }}
        run: python3 .github/scripts/blog_prod_gate.py stage --snapshot "$SNAPSHOT" --snapshot-sha256 "$SNAPSHOT_SHA256"

      - name: Build approved website only
        env:
          ENV_PROD: ${{ secrets.ENV_PROD }}
        run: |
          umask 077
          printf '%s\n' "$ENV_PROD" > .env
          cp .env apps/website/.env
          unset ENV_PROD BLOG_PROD_APPROVALS
          pnpm --filter @daodao/config generate:env
          pnpm --filter @daodao/website build

      - name: Record exact public release bytes
        env:
          FRONTEND_SHA: ${{ steps.gate.outputs.frontend-sha }}
          CONTENT_SHA: ${{ steps.gate.outputs.content-sha }}
          RELEASE_ID: ${{ steps.gate.outputs.release-id }}
        run: |
          python3 .github/scripts/blog_prod_artifact.py \
            --frontend-sha "$FRONTEND_SHA" --content-sha "$CONTENT_SHA" \
            --release-id "$RELEASE_ID"

      - name: Recheck source, approvals and deployment quiescence before registry access
        env:
          GH_TOKEN: ${{ github.token }}
          SNAPSHOT: ${{ steps.gate.outputs.snapshot }}
          SNAPSHOT_SHA256: ${{ steps.gate.outputs.snapshot-sha256 }}
        run: python3 .github/scripts/blog_prod_gate.py check --snapshot "$SNAPSHOT" --snapshot-sha256 "$SNAPSHOT_SHA256"

      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          username: ${{ secrets.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_ACCESS_TOKEN }}
      - name: Build immutable Website image
        id: image
        uses: docker/build-push-action@ca052bb54ab0790a636c9b5f226502c73d547a25 # v5
        with:
          context: .
          file: docker/production/Dockerfile
          target: website
          push: true
          platforms: linux/amd64
          tags: ${{ secrets.DOCKER_HUB_USERNAME }}/daodao-website:${{ steps.gate.outputs.release-id }}-${{ github.run_id }}-${{ github.run_attempt }}
          build-args: |
            APP_NAME=website
            APP_PORT=3000
            NODE_ENV=production

      - name: Recheck exact CI and source immediately before host access
        env:
          GH_TOKEN: ${{ github.token }}
          SNAPSHOT: ${{ steps.gate.outputs.snapshot }}
          SNAPSHOT_SHA256: ${{ steps.gate.outputs.snapshot-sha256 }}
        run: python3 .github/scripts/blog_prod_gate.py check --snapshot "$SNAPSHOT" --snapshot-sha256 "$SNAPSHOT_SHA256"

      - name: Deploy Website digest and verify public content with rollback
        env:
          BLOG_SSH_HOST: ${{ secrets.LINODE_INSTANCE_IP }}
          BLOG_SSH_PRIVATE_KEY: ${{ secrets.LINODE_SSH_PRIVATE_KEY }}
          IMAGE: ${{ secrets.DOCKER_HUB_USERNAME }}/daodao-website@${{ steps.image.outputs.digest }}
          FRONTEND_SHA: ${{ steps.gate.outputs.frontend-sha }}
          CONTENT_SHA: ${{ steps.gate.outputs.content-sha }}
          BASELINE_CONTENT_SHA: ${{ steps.gate.outputs.baseline-content-sha }}
          ALLOW_LEGACY_BOOTSTRAP: ${{ inputs.legacy_bootstrap && '1' || '0' }}
        run: |
          umask 077
          identity=$(mktemp "$RUNNER_TEMP/blog-prod-key.XXXXXX")
          trap 'rm -f "$identity"' EXIT
          printf '%s\n' "$BLOG_SSH_PRIVATE_KEY" > "$identity"
          unset BLOG_SSH_PRIVATE_KEY BLOG_PROD_APPROVALS
          BLOG_SSH_KEY_FILE="$identity" python3 .github/scripts/blog_prod_deploy.py \
            --image "$IMAGE" --frontend-sha "$FRONTEND_SHA" --content-sha "$CONTENT_SHA" \
            --baseline-content-sha "$BASELINE_CONTENT_SHA" --allow-legacy-bootstrap "$ALLOW_LEGACY_BOOTSTRAP"

      - name: Remove private runner inputs
        if: always()
        env:
          SNAPSHOT: ${{ steps.gate.outputs.snapshot }}
        run: |
          rm -f .env apps/website/.env
          if [ -n "$SNAPSHOT" ]; then rm -f -- "$SNAPSHOT"; fi
          if [ -n "${BLOG_APPROVALS_FILE:-}" ]; then rm -f -- "$BLOG_APPROVALS_FILE"; fi

