name: Sync OpenAPI

permissions:
  contents: write

on:
  workflow_dispatch:
  schedule:
    - cron: "0 21 * * *"
  repository_dispatch:
    types: [sync_openapi]

jobs:
  sync_openapi:
    name: Sync OpenAPI from Backend
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.SYNC_OPENAPI_PAT }}

      - name: Setup pnpm
        uses: pnpm/action-setup@a7487c7e89a18df4991f7f222e4898a00d66ddda

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"
          cache: "pnpm"

      - name: Setup GitHub CLI
        run: |
          gh auth login --with-token <<< "${{ secrets.SYNC_OPENAPI_PAT }}"

      - name: Fetch OpenAPI
        run: |
          set -euo pipefail
          
          # 獲取檔案內容
          CONTENT=$(gh api repos/daodaoedu/daodao-server/contents/generated/openapi-types.ts \
            --method GET \
            --jq '.content' \
            -f ref=dev) || {
            echo "❌ Failed to fetch OpenAPI types from backend"
            exit 1
          }
          
          # 檢查內容是否為空
          if [ -z "$CONTENT" ]; then
            echo "❌ OpenAPI content is empty"
            exit 1
          fi
          
          # 解碼 base64 內容
          echo "$CONTENT" | base64 -d > packages/api/src/types.ts || {
            echo "❌ Failed to decode base64 content"
            exit 1
          }
          
          # 驗證檔案是否成功寫入且有內容
          if [ ! -s packages/api/src/types.ts ]; then
            echo "❌ Generated types.ts file is empty"
            exit 1
          fi
          
          echo "✅ Successfully fetched and decoded OpenAPI types"

      - name: Check for changes
        id: check_changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add packages/api/src/types.ts
          git diff --cached --quiet || echo "changes=true" >> $GITHUB_OUTPUT

      - name: Commit and Push
        if: steps.check_changes.outputs.changes == 'true'
        run: |
          git commit -m "chore: sync OpenAPI types from backend"
          git push
