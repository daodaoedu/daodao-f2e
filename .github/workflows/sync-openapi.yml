name: Sync OpenAPI

permissions:
  contents: write

on:
  workflow_dispatch:
  schedule:
    - cron: "0 9 * * *"
  repository_dispatch:
    types: [sync_openapi]

jobs:
  sync_openapi:
    name: Sync OpenAPI from Backend
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.SYNC_OPENAPI_PAT }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"
          cache: "yarn"

      - name: Setup GitHub CLI
        run: |
          gh auth login --with-token <<< "${{ secrets.SYNC_OPENAPI_PAT }}"

      - name: Fetch OpenAPI
        run: |
          gh api repos/daodaoedu/daodao-server/contents/openapi.yaml \
            --method GET \
            --jq '.content' \
            -f ref=dev | base64 -d > services/openapi.yaml

      - name: Check for changes
        id: check_changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add services/openapi.yaml
          git diff --cached --quiet || echo "changes=true" >> $GITHUB_OUTPUT

      - name: Commit and Push
        if: steps.check_changes.outputs.changes == 'true'
        run: |
          git commit -m "chore: sync OpenAPI spec from backend"
          git push

      - name: Generate API Types
        if: steps.check_changes.outputs.changes == 'true'
        run: |
          npx orval
          git add services/generated
          git diff --cached --quiet || (git commit -m "chore: update generated API types" && git push)
