name: Mobile CI

concurrency:
  group: mobile-ci-${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

on:
  pull_request:
    branches:
      - dev
      - prod
    paths:
      - 'apps/mobile/**'
      - 'packages/design-tokens/**'
      - 'packages/shared/**'
      - 'packages/api/**'
      - 'pnpm-lock.yaml'

  push:
    branches:
      - dev
    paths:
      - 'apps/mobile/**'
      - 'packages/design-tokens/**'

  workflow_dispatch:

env:
  HUSKY: 0

jobs:
  typecheck:
    name: TypeScript Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Setup pnpm
        uses: pnpm/action-setup@a7487c7e89a18df4991f7f222e4898a00d66ddda

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install

      - name: Generate config env
        run: pnpm --filter @daodao/config generate:env

      - name: TypeScript Check (mobile)
        run: pnpm --filter @daodao/mobile typecheck

  lint:
    name: Lint Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Setup pnpm
        uses: pnpm/action-setup@a7487c7e89a18df4991f7f222e4898a00d66ddda

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install

      - name: Lint Check (mobile)
        run: pnpm --filter @daodao/mobile lint

  eas-build-check:
    name: EAS Build Check
    runs-on: ubuntu-latest
    needs: [typecheck, lint]

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Setup pnpm
        uses: pnpm/action-setup@a7487c7e89a18df4991f7f222e4898a00d66ddda

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'pnpm'

      - name: Setup Expo
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Install dependencies
        run: pnpm install

      - name: Validate EAS config
        working-directory: apps/mobile
        run: eas config --platform all
