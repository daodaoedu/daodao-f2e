name: Mobile CI

concurrency:
  group: mobile-ci-${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

on:
  pull_request:
    branches:
      - dev
      - prod
    paths:
      - 'apps/mobile/**'
      - 'packages/design-tokens/**'
      - 'packages/shared/**'
      - 'packages/api/**'
      - 'pnpm-lock.yaml'

  push:
    branches:
      - dev
    paths:
      - 'apps/mobile/**'
      - 'packages/design-tokens/**'

  workflow_dispatch:

env:
  HUSKY: 0

jobs:
  # ===== 合併 typecheck + lint 為同一 job，避免重複 install =====
  check:
    name: TypeScript & Lint Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Setup pnpm
        uses: pnpm/action-setup@a7487c7e89a18df4991f7f222e4898a00d66ddda

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install

      - name: Generate config env
        run: pnpm --filter @daodao/config generate:env

      - name: Run checks in parallel
        run: |
          pnpm --filter @daodao/mobile typecheck &
          pnpm --filter @daodao/mobile lint &
          wait

  eas-build-check:
    name: EAS Build Check
    runs-on: ubuntu-latest
    needs: [check]
    env:
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Setup pnpm
        uses: pnpm/action-setup@a7487c7e89a18df4991f7f222e4898a00d66ddda

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'pnpm'

      - name: Setup Expo
        if: env.EXPO_TOKEN != ''
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ env.EXPO_TOKEN }}

      - name: Install dependencies
        run: pnpm install

      - name: Validate EAS config
        if: env.EXPO_TOKEN != ''
        working-directory: apps/mobile
        run: |
          eas config --platform android --profile preview
          eas config --platform ios --profile preview

      - name: Skip EAS config validation
        if: env.EXPO_TOKEN == ''
        run: echo "EXPO_TOKEN is not configured; skipping EAS config validation."
