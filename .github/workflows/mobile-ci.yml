name: Mobile CI

concurrency:
  group: mobile-ci-${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

# Always trigger on PRs — internal skip handles non-mobile changes.
# This avoids the GitHub required-check anti-pattern where on.paths
# causes "Expected — waiting" on PRs that don't touch mobile files.
on:
  pull_request:
    branches:
      - dev
      - prod

  push:
    branches:
      - dev
    paths:
      - 'apps/mobile/**'
      - 'packages/design-tokens/**'

  workflow_dispatch:

env:
  HUSKY: 0

jobs:
  # ===== 合併 typecheck + lint 為同一 job，避免重複 install =====
  check:
    name: TypeScript & Lint Check
    runs-on: ubuntu-latest
    outputs:
      relevant: ${{ steps.changes.outputs.relevant }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Check for relevant changes
        if: github.event_name == 'pull_request'
        id: changes
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          CHANGED=$(gh pr diff ${{ github.event.pull_request.number }} --name-only)
          if echo "$CHANGED" | grep -qE '^(apps/mobile/|packages/design-tokens/|packages/shared/|packages/api/|pnpm-lock\.yaml)'; then
            echo "relevant=true" >> "$GITHUB_OUTPUT"
          else
            echo "relevant=false" >> "$GITHUB_OUTPUT"
            echo "ℹ️ No mobile-relevant changes; skipping"
          fi

      - name: Setup pnpm
        if: github.event_name != 'pull_request' || steps.changes.outputs.relevant == 'true'
        uses: pnpm/action-setup@a7487c7e89a18df4991f7f222e4898a00d66ddda

      - name: Setup Node.js
        if: github.event_name != 'pull_request' || steps.changes.outputs.relevant == 'true'
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'pnpm'

      - name: Install dependencies
        if: github.event_name != 'pull_request' || steps.changes.outputs.relevant == 'true'
        run: pnpm install

      - name: Generate config env
        if: github.event_name != 'pull_request' || steps.changes.outputs.relevant == 'true'
        run: pnpm --filter @daodao/config generate:env

      - name: Run checks in parallel
        if: github.event_name != 'pull_request' || steps.changes.outputs.relevant == 'true'
        run: |
          pnpm --filter @daodao/mobile typecheck &
          pnpm --filter @daodao/mobile lint &
          wait

  eas-build-check:
    name: EAS Build Check
    runs-on: ubuntu-latest
    needs: [check]
    if: ${{ needs.check.outputs.relevant != 'false' }}
    env:
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Setup pnpm
        uses: pnpm/action-setup@a7487c7e89a18df4991f7f222e4898a00d66ddda

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          # EAS CLI dependencies require Node 22; application checks keep .nvmrc.
          node-version: '22.18.0'
          cache: 'pnpm'

      - name: Setup Expo
        if: env.EXPO_TOKEN != ''
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ env.EXPO_TOKEN }}

      - name: Install dependencies
        run: pnpm install

      - name: Validate EAS config
        if: env.EXPO_TOKEN != ''
        working-directory: apps/mobile
        run: |
          eas config --platform android --profile preview
          eas config --platform ios --profile preview

      - name: Skip EAS config validation
        if: env.EXPO_TOKEN == ''
        run: echo "EXPO_TOKEN is not configured; skipping EAS config validation."
