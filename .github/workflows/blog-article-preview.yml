name: Article preview trust checks
on:
  pull_request:
    paths:
      - 'scripts/blog-article-preview.py'
      - 'scripts/blog-cloudflare-preview.py'
      - '.github/scripts/blog-dev-preview.py'
      - 'scripts/blog-release.py'
      - 'scripts/__tests__/test_blog_article_preview.py'
      - 'scripts/__tests__/test_blog_cloudflare_preview.py'
      - '.github/workflows/blog-article-preview.yml'
  push:
    branches: [dev]
    paths:
      - 'scripts/blog-article-preview.py'
      - 'scripts/blog-cloudflare-preview.py'
      - '.github/scripts/blog-dev-preview.py'
      - 'scripts/blog-release.py'
      - 'scripts/__tests__/test_blog_article_preview.py'
      - 'scripts/__tests__/test_blog_cloudflare_preview.py'
      - '.github/workflows/blog-article-preview.yml'
permissions:
  contents: read
jobs:
  preview-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - run: python3 -m unittest discover -s scripts/__tests__ -p 'test_blog*preview.py' -v
