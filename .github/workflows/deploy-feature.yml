name: Deploy Feature Branch

on:
  workflow_dispatch:
    inputs:
      branch:
        description: 'Feature branch name (without feat/ prefix)'
        required: true
        type: string
      app_name:
        description: 'Which app to deploy'
        required: true
        default: 'all'
        type: choice
        options:
          - all
          - website
          - product

env:
  DOCKER_HUB_USERNAME: ${{ secrets.DOCKER_HUB_USERNAME }}
  DOCKER_HUB_TOKEN: ${{ secrets.DOCKER_HUB_TOKEN }}

jobs:
  deploy-website:
    name: Deploy Website Feature Branch
    runs-on: ubuntu-latest
    if: ${{ github.event.inputs.app_name == 'all' || github.event.inputs.app_name == 'website' }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: feat/${{ github.event.inputs.branch }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_TOKEN }}

      - name: Build and push Website Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./docker/production/Dockerfile
          push: true
          build-args: |
            APP_NAME=website
            APP_PORT=3000
          tags: |
            ${{ secrets.DOCKER_HUB_USERNAME }}/daodao-website:${{ github.event.inputs.branch }}-latest
            ${{ secrets.DOCKER_HUB_USERNAME }}/daodao-website:${{ github.event.inputs.branch }}-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Deploy Website to Linode VPS
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.LINODE_HOST }}
          username: ${{ secrets.LINODE_USER }}
          key: ${{ secrets.LINODE_SSH_KEY }}
          script: |
            cd /path/to/daodao-f2e
            export DOCKER_HUB_USERNAME=${{ secrets.DOCKER_HUB_USERNAME }}
            export COMMIT_SHA=${{ github.sha }}
            ./deploy.sh feature website ${{ github.event.inputs.branch }}

      - name: Notify Discord
        if: always()
        uses: sarisia/actions-status-discord@v1
        with:
          webhook: ${{ secrets.DISCORD_WEBHOOK }}
          title: "${{ job.status == 'success' && '✅' || '❌' }} Feature Website Deployment"
          description: |
            **App:** Website
            **Environment:** Feature
            **Branch:** feat/${{ github.event.inputs.branch }}
            **Commit:** ${{ github.sha }}
            **URL:** https://feat-${{ github.event.inputs.branch }}.daodao.so
          color: ${{ job.status == 'success' && '0x00ff00' || '0xff0000' }}

  deploy-product:
    name: Deploy Product Feature Branch
    runs-on: ubuntu-latest
    if: ${{ github.event.inputs.app_name == 'all' || github.event.inputs.app_name == 'product' }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: feat/${{ github.event.inputs.branch }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_TOKEN }}

      - name: Build and push Product Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./docker/production/Dockerfile
          push: true
          build-args: |
            APP_NAME=product
            APP_PORT=3001
          tags: |
            ${{ secrets.DOCKER_HUB_USERNAME }}/daodao-product:${{ github.event.inputs.branch }}-latest
            ${{ secrets.DOCKER_HUB_USERNAME }}/daodao-product:${{ github.event.inputs.branch }}-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Deploy Product to Linode VPS
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.LINODE_HOST }}
          username: ${{ secrets.LINODE_USER }}
          key: ${{ secrets.LINODE_SSH_KEY }}
          script: |
            cd /path/to/daodao-f2e
            export DOCKER_HUB_USERNAME=${{ secrets.DOCKER_HUB_USERNAME }}
            export COMMIT_SHA=${{ github.sha }}
            ./deploy.sh feature product ${{ github.event.inputs.branch }}

      - name: Notify Discord
        if: always()
        uses: sarisia/actions-status-discord@v1
        with:
          webhook: ${{ secrets.DISCORD_WEBHOOK }}
          title: "${{ job.status == 'success' && '✅' || '❌' }} Feature Product Deployment"
          description: |
            **App:** Product
            **Environment:** Feature
            **Branch:** feat/${{ github.event.inputs.branch }}
            **Commit:** ${{ github.sha }}
            **URL:** https://app-feat-${{ github.event.inputs.branch }}.daodao.so
          color: ${{ job.status == 'success' && '0x00ff00' || '0xff0000' }}
