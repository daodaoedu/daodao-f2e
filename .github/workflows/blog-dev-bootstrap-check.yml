name: Blog development bootstrap contract
on:
  pull_request:
    paths:
      - '.github/scripts/blog_bootstrap/**'
      - '.github/scripts/blog-cd-ownership.py'
      - '.github/scripts/__tests__/test_blog*.py'
      - '.github/scripts/__tests__/integration_blog_publication_prepare.py'
      - '.github/workflows/blog-dev-bootstrap*.yml'
      - '.github/workflows/linode-cd.yml'
      - '.github/known-hosts/linode-dev.pub'
      - 'docker/blog-dev/**'
      - 'scripts/blog-release.py'
      - 'scripts/__tests__/test_blog_release.py'
  push:
    branches: [dev]
    paths:
      - '.github/scripts/blog_bootstrap/**'
      - '.github/scripts/blog-cd-ownership.py'
      - '.github/scripts/__tests__/test_blog*.py'
      - '.github/scripts/__tests__/integration_blog_publication_prepare.py'
      - '.github/workflows/blog-dev-bootstrap*.yml'
      - '.github/workflows/linode-cd.yml'
      - '.github/known-hosts/linode-dev.pub'
      - 'docker/blog-dev/**'
      - 'scripts/blog-release.py'
      - 'scripts/__tests__/test_blog_release.py'
permissions: {}
jobs:
  contract:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - run: 'python3 -m pip install --only-binary=:all: PyYAML==6.0.2'
      - run: python3 -m unittest discover -s .github/scripts/__tests__ -p 'test_blog*.py' -v
      - run: python3 -m unittest discover -s scripts/__tests__ -p 'test_blog_release.py' -v
  native-validator:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '20.19.4'
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: '10.20.0'
      - run: pnpm install --frozen-lockfile --filter "@daodao/blog-content..."
      - run: pnpm --filter @daodao/config generate:env
      - run: python3 .github/scripts/__tests__/integration_blog_publication_prepare.py
